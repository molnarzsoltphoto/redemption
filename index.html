people:{
 annaV4:{n:"Dr. Kerekes Bernadett", r:"vacsora", loc:"vendeglo4", h:[19,23], vis:"anna_vacsora_hiv4", gone:"anna_vacsora|anna_vacsora_rossz", bio:"Farmerben, köpeny nélkül, a szőke haja kibontva: szinte nem ismered meg. Már ül, amikor odaérsz, és két pohár víz áll az asztalon.", topics:[
  {id:"vacsora", l:"Leülsz vele", mins:120, dyn:"annaVacsora4"}
 ]},
 anna:{n:"Dr. Kerekes Bernadett", r:"traumatológus", loc:"korhaz", h:[8,20], bio:"41 éves traumatológus a Szent Jánosban. Alacsony, sportos, szőke, a haját lófarokban hordja, a csuklóján sportóra, a köpenyén kávéfolt. Úgy beszél a törésekről, mintha időjárás-jelentést olvasna fel, és közben a szeme nevet. Elvált, maratont fut, és azt mondja, rendőrökkel nem randevúzik, mert mind hazudnak. Tizenöt éve dolgozik egy osztályon Kónya Attilánéval.", topics:[
  {id:"bocsanat", l:"Bocsánatot kérsz a régi folyosóért", req:["anna_reszeg","!anna_bocsanat"], sober:1, t:"Felhúzza a szemöldökét. „Emlékszik rá? Akkor nem lehetett annyira részeg.” Aztán elmosolyodik. „Elfogadom. Egyszer.”", f:"anna_bocsanat"},
  {id:"vacsora", l:"Elhívod vacsorázni", req:["anna_met","!anna_reszeg|anna_bocsanat","!anna_vacsora","!anna_temetes","!anna_egyutt","!anna_vacsora_hiv4"], dyn:"annaHiv4"},
  {id:"elso", l:"Bemutatkozol", req:["!anna_met"], t:"„Mátrai? A Mátrai Gyula fia?” Kezet nyújt. „Kerekes Bernadett, de mindenki Dettinek hív. Én műtöttem az édesapját decemberben.” Rövid csend. „Sajnálom, hogy januárban…” Nem fejezi be. Nem is kell.", f:"anna_met"},
  {id:"erika", l:"Kónya Attilánéról kérdezed", req:["anna_met","korhazi_hiany|erika_inditek|suzuki_anpr"], sober:1, t:"Elsápad. „Erika? Tizenöt éve dolgozunk együtt. Ő tanított meg kanült szúrni, amikor rezidens voltam.” Lehalkítja a hangját. „Vasárnap a műszak végén sírt az öltözőben. Hétfőn úgy jött be, mintha semmi nem történt volna.” Rád néz. „Dénes. Ne tedd tönkre. Már mindent elvesztett.” Aztán: „De ha ő volt, akkor ne hazudj miatta. Se nekem, se magadnak.”", f:"anna_erika"},
  {id:"este", l:"Ma este?", req:["anna_vacsora|anna_temetes"], dyn:"annaEste"}
 ]},
 anna2:{n:"Detti", r:"nálad", loc:"otthon", h:[21,24], vis:"anna_egyutt", bio:"A konyhádban ül, teát főzött. A pálinkát valamikor a múlt héten kiöntötte a lefolyóba, és nem kérdezett meg előtte.", topics:[
  {id:"beszel", l:"Leülsz mellé", rep:1, eff:{crave:-20}, dyn:"annaOtthon"}
 ]},
 varga:{n:"Varga Ottó alezredes", r:"osztályvezető", loc:"kapitanysag", h:[7,19], gone:"varga_halott", bio:"56 éves. Áprilisban nyugdíjba megy. Az asztalán már ott a kartondoboz, amibe a fiók tartalmát pakolja. A whiskyt még nem tette bele.", topics:[
  {id:"elig", l:"Eligazítás", t:"„Az ügyészség délre öngyilkosságot akar. A minisztérium tegnapra. Somogyi túl sok mindent tudott túl sok emberről.” Leveszi a szemüvegét. „Ha nem az, Dénes, akkor csütörtök reggelig bizonyítsd be. Utána lezárják.”", f:"briefed"},
  {id:"kata", l:"Katáról", req:["kata_villa|kata_anpr"], t:"Sokáig hallgat. „Tudom, hogy ott volt. Az egész osztály tudja.” Becsukja a fiókot. „Ha ő tette, Dénes, akkor te leszel az, aki behozza. Senki más nem fogja megtenni.”"},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, dyn:"vargaStatus"}
 ]},
 szep:{n:"Dr. Szép Viktória", r:"megbízott osztályvezető", loc:"kapitanysag", h:[8,18], vis:"varga_halott", bio:"44 éves. Januárban még ellened nyomozott. Most ő vezeti az osztályt, és te vagy a legjobb embere. Egyikőtök sem tudja, hogyan kell ezt kezelni.", topics:[
  {id:"elig", l:"Eligazítás", t:"„Az ügyészség öngyilkosságot akar, a minisztérium tegnapra. Somogyi túl sok mindent tudott túl sok emberről.” Felnéz a füzetéből. „Csütörtök reggelig bizonyítsa be, főhadnagy, hogy nem az. Utána lezárják.”", f:"briefed"},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, dyn:"vargaStatus"}
 ]},
 bence:{n:"Tóth Bence", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"29 éves. Január óta ő hozza a kávét, és egyre jobb nyomozó. Ma reggel nem mer Katára nézni.", topics:[{id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintBence"}]},
 kata:{n:"Rácz Kata", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"36 éves. Rácz Gábor lánya. Hat évig kereste a bizonyítékot Somogyi ellen. Most Somogyi halott, és Kata nem mosolyog, nem sír, csak dolgozik, mintha semmi nem történt volna.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintKata"},
  {id:"vasarnap", l:"Hol voltál vasárnap este?", req:["kata_villa|kata_anpr"], sober:1, dyn:"kataVasarnap", ev:"kata_inditek"},
  {id:"utana", l:"És utána?", req:["kata_vallott"], t:"„Utána? A Hordóba mentem. Bokszos ott ült, ittunk. Nem akartam egyedül lenni.” Felnéz. „Kérdezd meg őket. Ne nekem higgy.”"}
 ]},
 halasz:{n:"Halász Tamás", r:"nyomszakértő", loc:"kapitanysag", h:[8,22], staff:1, bio:"41 éves, pedáns. A labor pincéjébe is betört a víz; a mintákat a második emeletre költöztette, és újra szól az Omega.", topics:[{id:"gond", l:"Mi van a laborban?", rep:1, dyn:"hintHalasz"}]},
 bodnar:{n:"Bodnár Feri", r:"törzszászlós", loc:"kapitanysag", h:[7,21], staff:1, gone:"bodnar_vad", bio:"58 éves, huszonöt éve jár utcára. Januárban hazavitt, amikor részeg voltál. Azóta mindig ő kérdezi meg elsőként, hogy vagy.", topics:[{id:"gond", l:"Mit gondolsz?", rep:1, t:"„Somogyi? Öngyilkos lett, Dénes. Az ilyenek mind azok lesznek a végén.” Megpaskolja a válladat. „Ne ásd túl mélyre. Áradáskor a mély víz visszaüt.”"}]},
 feher:{n:"Dr. Fehér Judit", r:"pszichológus", loc:"kapitanysag", h:[9,17], staff:1, bio:"52 éves. Januárban azt kérte, ne igyál. Most nem kér semmit, csak figyel.", topics:[
  {id:"na", l:"Leülsz vele", t:"„Hogy van, főhadnagy?” Most nem hallgatsz. Azt mondod: szomjas vagyok. Minden nap. Leteszi a tollat. Leír egy címet egy cetlire, és odaadja. „Szent József-templom, alagsor, minden este hattól. Nem kell beszélnie. Elég, ha ül.”", f:"aa_inv"},
  {id:"profil", l:"Somogyi „búcsúleveléről”", req:["bucsulevel"], t:"„Aki ezt írta, nem ismerte Somogyit, vagy nagyon is ismerte. »Nem bírom tovább a hazugságokat.« Somogyi soha nem nevezte hazugságnak, amit csinált.” Leveszi a szemüvegét. „Ez nem búcsúlevél, főhadnagy. Ez vád. Valaki kimondta helyette azt, amit szerinte be kellett volna vallania.”"}
 ]},
 keleti:{n:"Dr. Keleti Mária", r:"igazságügyi orvosszakértő", loc:"intezet", h:[7,19], staff:1, bio:"61 éves. Apád temetése óta kevesebbet dohányzik. Azt mondja, valakinek életben kell maradnia, aki emlékszik rá.", topics:[
  {id:"elozetes", l:"Előzetes vélemény", req:["body1"], t:"„Öngyilkosság, mondja az ügyészség. Délig akarják a papírt.” Kifújja a füstöt. „Nem adom oda délig. Van valami a karján, Dénes. Egy szúrás. Az öngyilkosok nem szoktak előtte injekciót kapni.”"},
  {id:"apa", l:"Apámról", req:["apa_halal"], t:"„Tegnap kint voltam nála. Friss virágot vittem.” Rád néz. „Ő is mindig azt mondta: ha valami túl simán zárul, akkor nem zárult le.”"}
 ]},
 hazvezeto:{n:"Mészáros Edit", r:"házvezetőnő", loc:"villa", h:[7,20], bio:"63 éves, tizenkét éve vezeti Somogyi háztartását. Ő találta meg reggel. Még mindig kötényben van, és nem tudja, kinek kell most főznie.", topics:[
  {id:"reggel", l:"Hogyan találta meg?", t:"„Hétkor jöttem, ahogy mindig. A dolgozószoba ajtaja nyitva, ő a fotelben.” Megtörli a szemét. „A jobb kezében a pisztoly. Pedig ő balkezes volt. Bal kézzel írt, bal kézzel evett, a lőtéren is bal kézzel lőtt. Mindig nevettünk rajta, hogy a balkezesek a legjobb lövészek.”", ev:"balkezes"},
  {id:"vasarnap", l:"Ki járt itt vasárnap?", sober:1, t:"„Nyolckor jött a sógora, a doktor úr. Pénzről kiabáltak, tízkor taxival ment el. Kilenc körül jött egy fiatal rendőrnő, nem tudom a nevét, sírt, kiabált, fél óra múlva elment.” Elhallgat. „Utána elküldött engem haza. Azt mondta, vendéget vár, egy hölgyet. Nem mondta, kit.”", ev:["berkes_latogatas","kata_villa"], f:"met_berkes_hir"},
  {id:"mate", l:"Ki volt még itt mostanában?", t:"„A kertész fiú, Máté. Vasárnap este is kijött, a fizetéséért. A főnök nem nyitott neki ajtót.” Sóhajt. „Kedves fiú. Mindig mindent lefényképezett, mert nem bízott senkiben.”", ev:"mate_villa"}
 ]},
 andrea:{n:"Somogyi Andrea", r:"az özvegy", loc:"villa", h:[10,20], suspect:1, bio:"42 éves, Berkes András húga. Elegáns, száraz szemű. Januárban beadta a válókeresetet. Most özvegy, és ez jogilag egészen más.", topics:[
  {id:"becs", l:"Hol volt a hétvégén?", t:"„Bécsben. Barátnőknél.” Ránéz az órájára. „Hétfő reggel jöttem haza, és itt várt a rendőrség.”", f:"met_andrea"},
  {id:"valas", l:"A válásról", t:"„Igen, válni akartam. Mindenki tudta. Kristóf nem volt könnyű ember.” Rágyújt. „És igen, a házassági szerződés szerint özvegyként minden az enyém. Ezt is mindenki tudja. Most már maga is.”", ev:"andrea_valas"},
  {id:"szef", l:"Ki tudta a széf kódját?", t:"„Én és ő. Ő azt hitte, csak ő.” Hidegen elmosolyodik. „Huszonkét év házasság, főhadnagy. Az ember megtanulja a kódokat.”", ev:"andrea_szef"},
  {id:"hazugsag", l:"Szembesít: nem volt Bécsben", req:["andrea_hazudott"], sober:1, t:"Elnyomja a cigarettát. „Jó. Budapesten voltam. Egy szállodában, valakivel, akit nem fog megismerni.” Feláll. „A recepció tudja, mikor mentem be és mikor jöttem ki. Kérdezze meg őket. Az én éjszakám unalmasabb volt, mint gondolja.”", f:"andrea_szallo"}
 ]},
 berkes:{n:"Dr. Berkes András", r:"volt klinikaigazgató", loc:"berkeshaz", h:[9,22], suspect:1, bio:"52 éves. A Szent Lukács bezárt, az orvosi engedélyét felfüggesztették, a felesége elhagyta. Az öltönye még drága, de már gyűrött.", topics:[
  {id:"vasarnap", l:"Vasárnap este", t:"„Kimentem hozzá. Pénzt kértem. A sógorom volt, a nővérem férje. Tizenöt évig falaztam neki.” Remeg a keze. „Kidobott. Taxival jöttem el, tízkor. Ennyi.”", f:"met_berkes"},
  {id:"harag", l:"Haragudott rá?", t:"„Haragudtam?” Felnevet, rosszul. „Hagyta, hogy a klinika ügyében mindent rám kenjenek. Megmentette volna magát, és engem eldobott. Igen, haragudtam.”", ev:"berkes_inditek"},
  {id:"utana", l:"Hova ment tízkor?", req:["met_berkes"], t:"„A kaszinóba. Hova máshova.” Lehajtja a fejét. „Elvesztettem ott majdnem kétmilliót. A Grand Casinóban, a rulettnél. Hajnali háromig.”", f:"berkes_kaszino"}
 ]},
 erika:{n:"Kónya Attiláné, Erika", r:"Kónya özvegye, ápolónő", loc:"erikahaz", h:[8,18], suspect:1, bio:"50 éves, a Szent János traumatológiáján ápolónő. Decemberben a férje halála után nem sírt. Januárban mindent átadott Gál Eszternek. Most nyugodt. Túlságosan.", topics:[
  {id:"somogyi", l:"Hallotta, mi történt Somogyival?", t:"„Hallottam.” Leveszi a szemüvegét, megtörli. „Nem fogok úgy tenni, mintha sajnálnám. Maga sem várja ezt tőlem.”", f:"met_erika"},
  {id:"attila", l:"A férjéről", sober:1, t:"„Somogyi ölette meg a férjemet, főhadnagy. Halmos csak a kéz volt.” A hangja egyenletes. „Hat évig fizették a hallgatásáért, és amikor beszélni akart, megfojtatták. Eszter megírta. És aztán Esztert is megölték.” Rád néz. „Maga mondta nekem decemberben, hogy az igazság ki fog derülni. Ki is derült. Csak senki nem fizetett érte.”", ev:"erika_inditek"},
  {id:"vasarnap", l:"Hol volt vasárnap este?", sober:1, t:"„Itthon. Egyedül.” Nem néz félre. „Hétfőn hajnalban kezdtem a kórházban. Mint mindig.”"},
  {id:"suzuki", l:"Szembesít: a piros Suzuki", req:["erika_villanal|suzuki_anpr"], sober:1, t:"Hosszan hallgat. Aztán leül a konyhaasztalhoz, és a kezét az asztalra teszi, ahogy egy beteg a vizsgálóasztalra. „Teát főztem neki. Azt hitte, pénzt akarok a dossziéért. Azt mondtam neki: aláírok egy papírt, hogy soha nem beszélek. Örült.” Felnéz. „Az ampullát a karjába adtam, amikor a teáját kavarta. Utána leültem mellé, és vártam, hogy elaludjon. Olyan volt, mint a betegek. Mind olyanok.”", f:"erika_vallott"},
  {id:"kedd", l:"Hol volt kedd éjjel?", req:["v2_found"], t:"„A kórházban. Éjszakás voltam, hét órától hétig.” Felnéz. „A fiú? A kertész? Nem tudtam, hogy ott volt vasárnap. Ha tudom…” Nem fejezi be."}
 ]},
 patikus:{n:"Szabó Éva", r:"kórházi gyógyszertárvezető", loc:"korhaz", h:[8,16], bio:"55 éves, a kórházi gyógyszertár vezetője. Minden ampullát számon tart, és ha egy hiányzik, az neki személyes sértés.", topics:[
  {id:"hiany", l:"Hiányzik valami mostanában?", req:["midazolam"], sober:1, t:"Elsápad, aztán előveszi a naplót. „Hétfőn észleltük. Vasárnap két ampulla midazolamot írtak ki egy betegre, aki nem kapta meg.” Leteszi eléd. „Belső vizsgálatot indítottam. Nem akartam elhinni, kinek a neve van rajta.”", doc:"gyogyszertar"},
  {id:"muszak", l:"Ki dolgozott kedd éjjel a traumatológián?", req:["met_erika"], t:"„Kedd éjjel? Kónya Attiláné, hét órától reggel hétig. Három műtétnél is asszisztált. Egy percre sem ment ki.”", ev:"erika_ejjeles"}
 ]},
 anya:{n:"Dudás Irén", r:"Máté anyja", loc:"kunhaz", h:[8,20], vis:"v2_found", bio:"47 éves. Bolti eladó. A bal karja gipszben, és amikor kérdezed, azt mondja, elesett a lépcsőn. Mindig a lépcsőn esik el.", topics:[
  {id:"mate", l:"Máté", t:"„Jó fiú volt. Mindig vigyázott rám.” Nem sír. A sírást már régen leszokta. „Azt mondta, elmegyünk. Hogy kivesz egy albérletet Pesterzsébeten, két szobát.”"},
  {id:"kedd", l:"Mi történt kedd este?", sober:1, req:["met_kun"], t:"Az ajtó felé néz, ahol Kun áll. Aztán a gipszére. Aztán rád. „Zoli tízkor elment Máté után. A gátra. Mondtam neki, hogy ne menjen.” Elhallgat. „Éjfél után jött haza. Lemosta a lapátot. Éjfélkor, főhadnagy. Ki mos le éjfélkor egy lapátot?”", ev:"kun_hazudik", f:"anya_vallott"},
  {id:"bantalmazas", l:"A karjáról", sober:1, req:["met_kun"], t:"Sokáig hallgat. „Tizenöt éve. Három feljelentés. Mindhármat visszavontam, mert különben…” Nem fejezi be. „Máté tizenkét éves volt, amikor először közénk állt. Eltört a karja.”", ev:"kun_eroszak"}
 ]},
 kun:{n:"Kun Zoltán", r:"Máté mostohaapja", loc:"kunhaz", h:[6,22], vis:"v2_found", suspect:1, bio:"52 éves, kőműves, széles váll, kemény kéz. Mosolyog, amikor beszél, és minden mondata végén a feleségére néz.", topics:[
  {id:"kedd", l:"Hol volt kedd este?", t:"„Itthon, néztem a meccset. A Fradi kikapott.” Mosolyog. „A fiú? Részeg volt, biztos beleesett a vízbe. Mindig is gyenge volt.”", f:"met_kun"},
  {id:"lapat", l:"Szembesít: a lapát", req:["kun_lapat_ded|kun_hazudik"], sober:1, t:"A mosoly eltűnik. „Homokzsákoztam. A gáton mindenki homokzsákoz.” Közelebb lép. „Maga részeg zsaru, főhadnagy. Mindenki tudja. Ki fog magának hinni?” A felesége az ajtóban áll, és most először nem néz le."}
 ]},
 onkentes:{n:"Pásztor Gergely", r:"árvízvédelmi önkéntes", loc:"gat", h:[0,24], vis:"v2_found", bio:"34 éves, informatikus, három napja homokzsákoz a gáton. Vizes, fáradt, és nagyon pontos.", topics:[
  {id:"kedd", l:"Látott valakit kedd éjjel?", sober:1, t:"„Tizenegy körül két férfit a gát tetején, a zsilip felé. Egy fiatalt, gumicsizmában, és egy idősebbet, széles vállút, homokzsáklapáttal. Veszekedtek, a fiatal kiabált valamit, hogy »elmegyünk«.” Megtörli a szemüvegét. „Aztán eleredt az eső, és nem láttam semmit. Fél óra múlva már csak egy embert láttam visszafelé.”", ev:"kun_gat"}
 ]},
 lili:{n:"Mátrai Lili", r:"a lányod", loc:"lilihaz", h:[17,21], bio:"17 éves. Az anyja áprilisban Bécsbe költözik egy állás miatt, és vinné Lilit is. Lili a bécsi konzervatóriumba felvételizne. Ehhez a te beleegyezésed is kell.", topics:[
  {id:"beszel", l:"Beszéltek", dyn:"liliBeszel"},
  {id:"elenged", l:"Beleegyezel, hogy Bécsbe menjen", req:["lili_beszelt","!lili_reszeg"], excl:"marasztal", t:"Aláírod. Lili nézi, ahogy írsz. „Nem leszel egyedül?” kérdezi. Ilyet még soha nem kérdezett. Azt mondod, nem. Nem tudod, igaz-e. „Hétvégente hazajövök. Vagy te jössz. Bécsben is van Hordó, gondolom.” Nevet, és te is.", f:"lili_elenged"},
  {id:"marasztal", l:"Arra kéred, maradjon", req:["lili_beszelt","!lili_reszeg"], excl:"elenged", t:"„Maradj. Itt is van konzervatórium.” Lili sokáig néz. Aztán bólint, lassan. „Jó. Maradok. De akkor te is maradj, apa. Józanul.” Az anyja a konyhaajtóban áll, és nem szól semmit. Nem is kell.", f:"lili_marad"}
 ]},
 sanyi:{n:"Sanyi", r:"NA-gyűlés, szponzor", loc:"aa", h:[18,21], bio:"68 éves, nyugdíjas mozdonyvezető, huszonkét éve józan. Lassan beszél, és mindenkit „testvér”-nek szólít, de nála ez nem fenyegetés.", topics:[
  {id:"ul", l:"Leülsz a körbe", mins:90, eff:{crave:-40}, t:"Leülsz a sor végére. Egy fiatal nő a kokainról beszél, egy öregember a feleségéről, aki elhagyta. Te nem beszélsz. Kilencven perc. Amikor kijössz, esik az eső, és egy órán át nem gondolsz arra, hogy inni kellene.", f:"aa1"},
  {id:"beszel", l:"Megszólalsz", req:["aa1"], mins:90, eff:{crave:-35}, t:"„Dénes vagyok.” A hangod idegen. „Alkoholista vagyok.” Senki nem tapsol, senki nem néz rád furcsán. Valaki bólint. Elmondod a kiesett éjszakát januárban, a sálat a fán, apádat. Sanyi a végén megszorítja a kezed. „Csak a mai nap, testvér. Holnappal ráérsz holnap.”", f:"aa_beszed"},
  {id:"ujra", l:"Újra eljössz", req:["aa_beszed"], rep:1, mins:90, eff:{crave:-30}, t:"Ugyanaz a pince, ugyanaz a kávé. Már tudod, hova kell ülni. Ez is valami."}
 ]},
 laci:{n:"Laci", r:"kocsmáros", loc:"hordo", h:[15,3], bio:"A Hordó kocsmárosa. Homokzsákokon áll a pult mögött.", topics:[
  {id:"kata", l:"Kata vasárnap este", req:["kata_vallott|kata_villa"], t:"„Kata? Tíz után jött, leült Bokszos mellé. Nem ivott sokat, csak ült. Egykor Bokszos hazakísérte.” Törölgeti a poharat. „Úgy nézett ki, mint aki most temetett el valakit.”", ev:"kata_alibi"},
  {id:"pletyka", l:"Mit beszélnek?", t:"„Hogy Somogyi végre megtette, amit kellett.” Vállat von. „Aki ismerte, nem hiszi. Az ilyen ember nem lövi fejbe magát. Az ilyen ember mást lövet fejbe.”"}
 ]},
 bokszos:{n:"Szikszai „Bokszos” Imre", r:"gyerekkori barát", loc:"hordo", h:[19,2], bio:"47 éves, volt bokszoló. Mostanában kevesebbet iszik, és ezt nem kommentálja.", topics:[
  {id:"kata", l:"Kata vasárnap", req:["kata_villa|kata_anpr|kata_vallott"], t:"„Kata itt ült velem tíztől egyig. Az apjáról beszélt. Azt mondta, elment Somogyihoz, hogy a szemébe mondja, és Somogyi kinevette.” Leteszi a poharat. „Egykor hazakísértem. Ő nem ölt meg senkit, Dénes. Ő csak sírt.”", ev:"kata_alibi"},
  {id:"regi", l:"Csak beszélgettek", rep:1, dyn:"bokszosTalk"}
 ]},

end:{
 title:function(S){return(S.verd.v1&&S.verd.v1.ok&&S.verd.v2&&S.verd.v2.ok)?"Ügy lezárva":"Ügy lezárva – de nem úgy"},
 multi:function(S){
  const V=S.verd,ok=v=>V[v]&&V[v].ok;let t="";
  if(ok("v1"))t+="<p>Kónya Attiláné a kihallgatóban ugyanúgy ül, mint a konyhaasztalánál: a kezét az asztalra teszi, nyugodtan. Mindent elmond. A teát, az ampullát, a kezet, amit a fegyverre igazított. A búcsúlevelet, amit otthon írt meg, hetekkel korábban.</p><p>A végén csak ennyit kérdez: „Mennyi jár érte?” Megmondod. Bólint. „Attiláért ennyit.”</p>";
  else if(V.v1&&V.v1.s==="kata")t+="<p>Rácz Katát őrizetbe veszik Somogyi Kristóf meggyilkolásának gyanújával. Nem tiltakozik. A kihallgatáson egyetlen mondatot mond, és az neked szól: „Ezt tanítottad, Dénes. Hogy nézzek utána.” Te nem néztél.</p><p>Hat héttel később a Szent János kórház belső vizsgálata egy hiányzó ampulla miatt megkeres egy ápolónőt. Az ápolónő mindent beismer. Kata szabadul. Soha többé nem szól hozzád.</p>";
  else if(V.v1)t+="<p>Az ügyészség vádat emel. A tárgyalás hónapokig húzódik, és a végén a vádlottat felmentik. Somogyi gyilkosa egy újpesti konyhaasztalnál ül minden este, egyedül, és vár. Senki nem jön.</p>";
  if(ok("v2"))t+="<p>Kun Zoltánt a gát tövében tartóztatják le, homokzsákozás közben. Mosolyog, amikor megbilincselik, és a feleségére néz. Dudás Irén most először nem néz le. A gipszes kezével becsukja az ablakot.</p>";
  else if(V.v2)t+="<p>Dudás Máté ügyét lezárják. Kun Zoltán a temetésen a koporsó mellett áll, és a felesége vállát fogja. Erősen.</p>";
  if(S.f.lili_elenged)t+="<p>Áprilisban kikíséred Lilit és az anyját a Keleti pályaudvarra. Lili az ablakból integet, amíg a vonat ki nem ér a csarnokból. Hazafelé nem mész be a Hordóba. Ma nem.</p>";
  else if(S.f.lili_marad)t+="<p>Lili Budán marad, az anyja nélkül, nálad. A kis szobát kifested neki, rosszul. Ő átfesti, jól. Esténként zongorázik, és te hallgatod a fal mögül.</p>";
  else if(S.f.lili_reszeg)t+="<p>Áprilisban Lili Bécsbe költözik az anyjával. Az aláírást egy ügyvéd intézte el helyetted. Egy képeslapot küld a konzervatóriumból: <i>Felvettek.</i> Semmi más.</p>";
  if(S.f.aa_beszed)t+="<p>Szerda este a Szent József-templom alagsorában ülsz, a sor végén. Sanyi bólint, amikor belépsz. Valaki más beszél, egy fiatal fiú. Hallgatod. Csak a mai nap.</p>";
  else if(S.f.aa1)t+="<p>Egyszer voltál a gyűlésen. A cetlit Fehér doktornőtől a pénztárcádban hordod. Talán jövő héten újra.</p>";
  if(S.f.apa_halal)t+="<p>Vasárnap kimész Farkasrétre. Friss virágot viszel. Elmondod apádnak, hogyan zárult az ügy, és mit kérdezett volna ő a végén: ki járt jól? Ezúttal senki. Ezúttal ez a válasz.</p>";
  if(S.f.anna_egyutt&&S.f.erika_vad)t+="<p>Detti három napig nem hív. A negyedik este becsönget, kisírt szemmel. „Bementem hozzá. Azt mondta, te voltál az egyetlen, aki rendesen beszélt vele.” Leül a konyhában. „Utállak egy kicsit. Maradhatok?”</p>";
  else if(S.f.anna_egyutt)t+="<p>Detti fogkeféje a fürdőszobádban. Nem beszéltetek róla. Egyszerűen ott van.</p>";
  else if(S.f.anna_erika)t+="<p>Detti azt mondta, ne hazudj se neki, se magadnak. Nem hazudtál. Most már csak fel kéne hívnod.</p>";
  return t;
 },

}

 ildiko_szakit:{v:"v1", n:"Aznap este szakítani akart", d:"Ildikó aznap este azt mondta Majornak: „Ma este megmondom Imrének, hogy vége. Utána hozzád jövök.”"},
 denes_alibi_2006:{v:"v1", n:"Az alibi, amit te adtál", d:"A 2006-os aktában: „Szikszai Imre alibijét Mátrai Dénes r. járőr igazolta: egész éjjel együtt voltak a Hordóban.” A te aláírásod."},
 apa_megjegyzes:{v:"v1", n:"Apád ceruzás megjegyzése", d:"Az akta margóján apád írásával: „Dénes részeg volt. Imre nem. Nem kérdezek tovább. – M. Gy.”"},

 bajnok1998:{n:"Az 1998-as bajnokcsapat", d:"A Vasas falán bekeretezett fotó: az 1998-as bajnokcsapat, mindegyikük ujján ugyanaz a pecsétgyűrű. Középen Szikszai Imre, nehézsúly."},
 bokszos_ildiko:{v:"v1", n:"Imre és Ildikó", d:"Imre anyja szerint 2006-ban Imre egy Ildikó nevű nővel járt, és el akarta venni. Aztán a nő eltűnt, és Imre azóta nem nősült meg.", sup:[["bokszos","I","v1"]]},
 bokszos_vallomas:{v:"v1", n:"Imre vallomása", d:"„Megmondta, hogy elmegy. Megütöttem. Egyszer. Elesett, a rakpart peremén. Nem mozdult többet.”", sup:[["bokszos","I","v1"],["bokszos","A","v1"]]},

 bence_terv:{n:"„Vasárnap este a Vasasnál”", d:"Bence jegyzete: „Vasárnap este a Vasasnál találkozom vele. Négyszemközt. Dénest nem akarom belekeverni, a barátja.”"},
 bence_kartya:{v:"v2", n:"Bence igazolványa", d:"Bence rendőrigazolványa a régi bokszterem ringje alatt, egy beszáradt vércsepp mellett.", sup:[["bokszos","A","v2"]]},

 bence_test:{v:"v2", n:"Bence holtteste", d:"Bence a kunyhó betonpadlóján, összekötözött kézzel. A kunyhó ajtaja kívülről lakatolva. A hőség ölte meg."},
 kunyho_lakat:{v:"v2", n:"Lakat kívülről", d:"A kiskerti kunyhó ajtaján kívülről új lakat. Bent víz, élelem, ablak nincs. Harmincnyolc fok kint, ötvenegy bent.", sup:[["bokszos","M","v2"]]},
 bence_tudta:{v:"v2", n:"Bence tudta, ki volt", d:"Bence megtalálta Ildikó utolsó hívását, és vasárnap négyszemközt akart beszélni a szám tulajdonosával.", sup:[["bokszos","I","v2"]]},
 bence_vallomas:{v:"v1", n:"Bence elmondja", d:"„Imre volt. Azt mondta, nem akar bántani, csak időt akar. Hogy előbb neked akarja elmondani, de nem tudja, hogyan.”", sup:[["bokszos","A","v1"]]},

 gyuru_bokszos:{v:"v1", n:"Imre gyűrűje", d:"Csepeli Vasas, 1998, bajnok. A csapatképen csak egyetlen ember ujján volt ilyen gyűrű, aki ismerte Ildikót.", sup:[["bokszos","A","v1"]], ded:true},
 bokszos_ut:{v:"v1", n:"Egy nehézsúlyú ütése", d:"Ököl erejű ütés a járomcsontra. Egy nehézsúlyú bokszoló egyetlen ütése, aztán egy perem.", sup:[["bokszos","M","v1"]], ded:true},
 hamis_alibi:{v:"v1", n:"Hamis alibi", d:"Te igazoltad Imre alibijét 2006-ban, részegen, és nem emlékszel. Apád tudta. És hallgatott, miattad.", ded:true, f:"tudod_2006"},
 imre_szama:{v:"v1", n:"Ildikó utolsó hívása Imrének", d:"23:41, két perc, Szikszai Imre. Ildikó megmondta neki, hogy vége. Egy órával később megállt az órája.", sup:[["bokszos","A","v1"]], ded:true, f:"bokszos_gyanu"},
 inditek_szakitas:{v:"v1", n:"Aznap éjjel szakított vele", d:"Ildikó azt mondta Majornak, ma este megmondja Imrének. Imre el akarta venni. Huszonegy év óta nem nősült meg.", sup:[["bokszos","I","v1"]], ded:true}
},

docs:{
 csontok:{t:"Antropológiai vizsgálat – a mederben talált maradványok", b:"IGAZSÁGÜGYI ORVOSTANI INTÉZET\nVizsgálta: dr. Keleti Mária\n\nAzonosítás (fogazat, korábbi törés): Lengyel Ildikó, szül. 1975, eltűnt 2006. 07. 14.\n[[oklos_ut|A bal járomcsonton ököl erejű, nagy energiájú ütés okozta törés. A koponyaalapon éles peremre zuhanásból eredő törés: ez okozta a halált.]]\nAz elhunyt a halál után került a gépkocsiba.\n\n— K. M.: „Dénes, apád vitte ezt az ügyet. Emlékszem, mennyire nem akarta lezárni. Aztán egyik napról a másikra lezárta.”"},
 akta2006:{t:"BRFK akta, 2006 – Lengyel Ildikó eltűnése", b:"BUDAPESTI RENDŐR-FŐKAPITÁNYSÁG – Életvédelmi osztály\nEltűnés, 2006. 07. 14.\nVezető nyomozó: Mátrai Gyula főhadnagy\n\nAz eltűnt 31 éves, reklámügynökségi asszisztens. Utoljára 22:45-kor látták Csepelen, a Hordó presszó közelében, gépkocsijával.\n\n[[lengyel_feltekeny|Lengyel Tamás (különváltan élő férj): az eltűntet többször megfenyegette, két feljelentés.]] [[lengyel_nincs_alibi|Állítása szerint otthon aludt, tanúja nincs.]] [[lengyel_vontato|Foglalkozása: autómentő-sofőr.]]\n\n[[major_viszony|Major Gábor (munkáltató, nős): az eltűnttel viszonyt folytatott, ezt beismerte.]]\n\nSzikszai Imre (az eltűnt barátja, ökölvívó): [[denes_alibi_2006|alibijét Mátrai Dénes r. járőr igazolta: egész éjjel együtt voltak a Hordó presszóban.]]\n\nAz ügy holttest hiányában felfüggesztve.\n\n[[apa_megjegyzes|A margón, ceruzával, apád írásával: „Dénes részeg volt. Imre nem. Nem kérdezek tovább. – M. Gy.”]]"},
 bence_jegyzet:{t:"Tóth Bence jegyzetfüzete", b:"Spirálfüzet, Bence gondos, kicsit gyerekes kézírása, a margón kérdőjelek.\n\nLengyel Ildikó, 2006. Az Astra a mederben, csütörtök óta nálam.\n\nAz akta: Mátrai Gy. vezette. Lengyel T. gyanús volt.\n[[lengyel_korhaz|Lengyel T. 2006. 07. 14-én 21:30-tól a Szent Lászlóban feküdt, vakbélműtét. Kizárva. (Kértem a kórházi naplót, megvan.)]]\n\nKikértem a 2006-os híváslistát az archívumból:\n[[utolso_hivas_2006|23:41, Lengyel I. utolsó hívása: 06-30-…-4417, 2 perc.]]\nHolnap kikérem a szolgáltatótól, kié a szám.\n\nVasárnap, délután:\nMegvan, kié. Nem akarom elhinni.\n[[bence_terv|Vasárnap este a Vasasnál találkozom vele. Négyszemközt. Dénest nem akarom belekeverni, a barátja.]]\n\nAz utolsó oldalon, aláhúzva: „Lehet, hogy tévedek. Remélem, tévedek.”"},
 szam:{t:"Előfizetői adatok – 06-30-…-4417", b:"SZOLGÁLTATÓI ADATSZOLGÁLTATÁS\nMegkereső: Rácz K. / Halász T. (Tóth B. vasárnapi megkeresése alapján)\n\n[[szam_imre|Előfizető 2003 óta: Szikszai Imre, Csepel, Szent Imre tér 4. A szám ma is aktív.]]\n\nA szolgáltató megjegyzése: ugyanezt az adatot vasárnap 14:20-kor Tóth Bence nyomozó is kikérte."},
 cella:{t:"Cellainformáció – Tóth Bence telefonja", b:"SZOLGÁLTATÓI ADATSZOLGÁLTATÁS\nElőfizető: Tóth Bence\n\n2027. 07. 11. 20:40  Kőbánya (otthon)\n[[bence_cella|2027. 07. 11. 22:10  Csepel, a Vasas sporttelep cellája. Ezt követően a készülék nem jelentkezett be.]]"}
},

   {id:"auto", l:"A vezetőülés", t:"A vezetőülésen egy nő csontjai, a biztonsági öv még becsatolva, mintha valaki gondosan becsatolta volna. A csuklón egy karóra, megállt 0:52-kor.", ev:"ildiko_test", f:"body1"},
   {id:"fek", l:"A kézifék és a váltó", t:"A kézifék kiengedve, a váltó üresben. Ez az autó nem hajtott a vízbe. Ezt az autót betolták.", ev:"kezifek"},
   {id:"labter", l:"Az utasoldali lábtér", t:"Az iszap alatt valami kemény. Egy férfi pecsétgyűrű, nehéz, ezüst: „Csepeli Vasas, 1998, bajnok”. Láttál már ilyet. Nem jut eszedbe, hol.", ev:"klubgyuru"},
   {id:"hatso", l:"A hátsó ülés", t:"Egy női táska, benne egy Nokia, egy rúzs, és egy vízben szétmállott fénykép: két ember egy bokszmeccs lelátóján. Az egyik nő, vörös hajú. A másik arca elmosódott.", ev:"ildiko_taska"}

   {id:"ring", l:"A ring alatt", t:"A ring alatt, a por közt egy rendőrigazolvány. Tóth Bence, nyomozó. Mellette egy beszáradt vércsepp. Bence itt volt vasárnap este. És nem ment el innen magától.", ev:"bence_kartya", f:"bence_itt"},
   {id:"fal", l:"A trófeafal", t:"Bekeretezett fényképek, megsárgult oklevelek. 1998, bajnokcsapat, öt fiatal férfi, mindegyikük ujján ugyanaz a pecsétgyűrű. Középen, a legnagyobb, nehézsúly: Szikszai Imre. Huszonkilenc évvel ezelőtt. Te is ott voltál a lelátón.", ev:"bajnok1998"},

   {id:"mentes", l:"Kinyitod a kunyhót", req:["!bence_mentve","!bence_halott"], t:"A lakat nehezen enged. Bent ötven fok, a levegő áll, mint a víz. Bence a betonpadlón fekszik, összekötözött kézzel, a szája kicserepesedett, de a szeme nyitva. Amikor meglát, megpróbál mosolyogni. „Tudtam, hogy jössz” — suttogja. „Imre is tudta.” Vizet adsz neki, lassan, ahogy apád tanította egyszer egy nyári helyszínen.", ev:"bence_vallomas", f:["bence_mentve","bokszos_eltunt"]},
   {id:"halott", l:"A kunyhó", req:["bence_halott"], t:"A kunyhó ajtaja kívülről lakatolva, a lakatot a helyszínelők már levágták. Bent ötvenegy fok. Bence a betonpadlón fekszik, összekötözött kézzel, oldalra fordulva, mintha aludna. A falon egy kréta-felirat, reszkető betűkkel: DÉNES TUDJA. Nem tudod, Imre írta-e, vagy Bence.", ev:["bence_test","kunyho_lakat","bence_tudta"]}
 ]},

 ]},
 anna_korhaz:{n:"Dr. Kerekes Bernadett", r:"traumatológus", loc:"korhaz5", h:[8,20], bio:"41 éves traumatológus a Szent Jánosban. Alacsony, sportos, szőke, a haját lófarokban hordja, a csuklóján sportóra, a köpenyén kávéfolt. Úgy beszél a törésekről, mintha időjárás-jelentést olvasna fel, és közben a szeme nevet. Elvált, maratont fut, és azt mondja, rendőrökkel nem randevúzik, mert mind hazudnak.", topics:[
  {id:"bocsanat", l:"Bocsánatot kérsz a régi folyosóért", req:["anna_reszeg","!anna_bocsanat"], sober:1, t:"Felhúzza a szemöldökét. „Emlékszik rá? Akkor nem lehetett annyira részeg.” Aztán elmosolyodik. „Elfogadom. Egyszer.”", f:"anna_bocsanat"},
  {id:"vacsora", l:"Elhívod vacsorázni", req:["anna_met","!anna_reszeg|anna_bocsanat","!anna_vacsora","!anna_temetes","!anna_egyutt","!anna_vacsora_hiv5"], dyn:"annaHiv5"},
  {id:"elso", l:"Bemutatkozol", req:["!anna_met"], t:"„Mátrai? A Mátrai Gyula fia?” Kezet nyújt. „Kerekes Bernadett, de mindenki Dettinek hív. Én műtöttem az édesapját.” Rövid csend. „Sajnálom, hogy januárban…” Nem fejezi be.", f:"anna_met"},
  {id:"este", l:"Ma este?", req:["anna_vacsora","!anna_egyutt"], dyn:"annaEste5"},
  {id:"hello", l:"Beszélsz vele", req:["anna_met","!anna_egyutt"], t:"„Mátrai.” Leveszi a maszkot. „Láttam a hírekben a kollégáját. Ha megtalálja, és kiszáradt, ne öntsön bele vizet egyszerre. Lassan. És hívjon engem.” Ír egy számot a kezedre, golyóstollal. Megint.", f:"anna_tanacs"}
 ]},
 szep:{n:"Dr. Szép Viktória", r:"osztályvezető", loc:"kapitanysag", h:[8,20], bio:"44 éves. Májustól ő vezeti az osztályt. Bencét ő vette fel annak idején, és most egész nap a telefonját nézi.", topics:[
  {id:"elig", l:"Eligazítás", t:"„Bence csütörtökön kérte el az Astra-ügyet. Azt mondta, régi ügy, megoldja egyedül.” Leteszi a tollat. „Vasárnap este nyolckor még írt nekem egy e-mailt, hogy hétfőn beszélni akar velem. Nem írta meg, miről.” Rád néz. „Keresse meg, főhadnagy. Utána a csontokat.”", f:"briefed"},
  {id:"bevall", l:"Elmondod neki a 2006-os alibit", req:["hamis_alibi"], sober:1, t:"Hosszan hallgat, miközben beszélsz. Nem jegyzetel. Amikor végzel, lassan bólint. „Huszonegy éves hamis tanúzás, ami elévült.” Leveszi a szemüvegét. „Nem fogom felírni, Mátrai. De maga se felejtse el soha. Bencéért se.”", f:"denes_bevall", pat:-10},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, dyn:"vargaStatus"}
 ]},
 bence:{n:"Tóth Bence", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, gone:"bence_eltunt", bio:"29 éves. Eltűnt.", topics:[{id:"gond", l:"Mit gondolsz?", rep:1, t:"…"}]},
 kata:{n:"Rácz Kata", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, gone:"kata_vad", bio:"36 éves. Bencét ő tanította meg a cellainformációk olvasására. Ma reggel óta nem ült le.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintKata"}
 ]},
 bodnar:{n:"Bodnár Feri", r:"törzszászlós", loc:"kapitanysag", h:[7,21], staff:1, gone:"bodnar_vad", bio:"58 éves. Nyáron is kabátban jár.", topics:[{id:"gond", l:"Mit gondolsz?", rep:1, t:"„A gyerek? Biztos csajozik valahol. Fiatal.” Nem néz rád."}]},
 halasz:{n:"Halász Tamás", r:"nyomszakértő", loc:"kapitanysag", h:[8,22], staff:1, bio:"41 éves. Bencével minden pénteken sakkoztak a laborban. Ma nem szól az Omega.", topics:[{id:"gond", l:"Mi van a laborban?", rep:1, dyn:"hintHalasz"}]},
 feher:{n:"Dr. Fehér Judit", r:"pszichológus", loc:"kapitanysag", h:[9,17], staff:1, bio:"52 éves. Négy hónapja minden héten megkérdezi, hány napja vagy józan.", topics:[
  {id:"profil", l:"Ki tarthatja fogva Bencét?", req:["bence_itt|bence_terv"], t:"„Aki ezt tette, nem akarja megölni. Ha akarta volna, már megtette volna.” Leveszi a szemüvegét. „Időt akar. Valakinek el kell mondania valamit, és nem tudja, hogyan. Az ilyen ember valahova visz, ami az övé. Egy hely, ahol gyerekkorában biztonságban érezte magát.” Rád néz. „És főhadnagy: ebben a hőségben az ilyen helyeken napok kérdése.”"},
  {id:"jozan", l:"A józanságról", rep:1, dyn:"feherJozan"}
 ]},
 keleti:{n:"Dr. Keleti Mária", r:"igazságügyi orvosszakértő", loc:"intezet", h:[7,19], staff:1, bio:"61 éves. Apád barátja. A 2006-os ügyben ő azonosította volna a holttestet, ha lett volna holttest.", topics:[
  {id:"elozetes", l:"Előzetes vélemény", req:["body1"], t:"„Egy nő, harmincas, huszonegy éve van a vízben.” Rágyújt, pedig az ablak zárva. „Valaki nagyon erősen megütötte, Dénes. Nem kéz volt, ököl. Olyan ütés, amitől egy férfi is elterül.”"},
  {id:"2006", l:"Emlékszel a 2006-os ügyre?", t:"„Apád nem akarta lezárni. Hetekig ült rajta. Aztán egyik napról a másikra lezárta, és soha többé nem beszélt róla.” Kifújja a füstöt. „Azt hittem, valaki nyomást gyakorolt rá. Most már nem tudom.”"}
 ]},
 laci:{n:"Laci", r:"kocsmáros", loc:"hordo", h:[15,3], bio:"A Hordó kocsmárosa. 2006-ban is ő állt a pult mögött. Emlékszik mindenre. Ez a baja.", topics:[
  {id:"bence", l:"Láttad Bencét vasárnap?", t:"„A fiatal kollégádat? Nem. Nem járt itt.” Törölgeti a poharat. „Imre vasárnap nem jött be. Húsz év alatt talán háromszor fordult elő.”", f:"imre_vasarnap"},
  {id:"2006", l:"2006. július 14.", req:["denes_alibi_2006"], sober:1, t:"Leteszi a poharat. Sokáig néz. „Emlékszem. A vb-döntő után volt pár nappal. Te egykor bealudtál a pultnál, én takartalak be. Imre tizenegy után elment, a vörös nő után. Hajnalban jött vissza, csuromvizes cipőben.” Elhallgat. „Másnap azt mondtad a nyomozóknak, hogy egész éjjel együtt voltatok. Én nem szóltam. Apád sem.”", ev:"alibi_hamis"}
 ]},
 bokszos:{n:"Szikszai „Bokszos” Imre", r:"gyerekkori barát", loc:"hordo", h:[19,2], gone:"bokszos_eltunt", bio:"47 éves, volt nehézsúlyú bokszoló, éjszakai portás. Gyerekkorod óta ismered. Ma este a kezét az asztal alatt tartja.", topics:[
  {id:"bence", l:"Bencét keresem", t:"„A gyereket? Bencét?” Iszik. „Nem láttam. Vasárnap… nem, vasárnap nem jöttem be, fájt a fejem.” Felnéz. „Segítek keresni, Dénes. Bármit.” A kezét kiveszi az asztal alól, hogy megfogja a válladat. A bütykei lehorzsolva, frissen.", f:"bokszos_kez"},
  {id:"ildiko", l:"Emlékszel Lengyel Ildikóra?", req:["body1"], t:"Sokáig nem válaszol. A poharát forgatja. „A vörös? Persze.” Halkan. „Jártunk egy darabig. Aztán eltűnt. Huszonegy éve.” Nem néz rád. „Megtalálták, ugye? Hallottam a rádióban. Az öbölben.”"},
  {id:"gyuru", l:"Megkérdezed a gyűrűjéről", req:["klubgyuru"], sober:1, t:"A keze megáll a pohár fölött. „Elvesztettem. Régen.” Megdörzsöli a csupasz ujját, ahol a bőr ma is világosabb. „Miért kérdezed?” Most először látod rajta, hogy fél. Tőled."},
  {id:"regi", l:"Csak ültök", rep:1, dyn:"bokszosC5"}
 ]},
 bokszos2:{n:"Szikszai „Bokszos” Imre", r:"gyerekkori barát", loc:"kert", h:[0,24], vis:"bokszos_eltunt", gone:"bokszos_vad", bio:"47 éves. A kunyhó előtt ül egy sörösládán, a napon. Három napja nem aludt. Amikor meglát, nem menekül.", topics:[
  {id:"miert", l:"Miért, Imre?", sober:1, t:"„Megmondta, hogy elmegy. A főnökéhez. Hogy vége.” A kezét nézi. „Megütöttem. Egyszer, Dénes. Egyetlenegyszer életemben ütöttem meg nőt. Elesett, a rakpart peremén, és nem mozdult többet.” Felnéz. „Betettem a kocsijába, és betoltam a vízbe. Aztán visszamentem a Hordóba, és te ott aludtál a pultnál.”", ev:"bokszos_vallomas"},
  {id:"bence", l:"És Bence?", t:"„Nem akartam bántani. Vasárnap odajött a Vasashoz, egyedül, és azt mondta, tudja. Megijedtem. Leütöttem.” Megrázza a fejét. „Időt akartam. Hogy előbb neked mondjam el. Hogy te hallja tőlem, ne egy aktából. De nem tudtam, hogyan.”"},
  {id:"alibi", l:"A 2006-os alibi", req:["denes_alibi_2006"], t:"Hosszan néz. „Te adtad, Dénes. Másnap reggel megkérdeztem, emlékszel-e, hogy egész éjjel együtt voltunk. Azt mondtad, persze. Nem emlékeztél semmire.” Halkan nevet. „Te soha nem emlékszel semmire. Ezért voltál a legjobb barátom.”"}
 ]},
 imreanya:{n:"Szikszai Imréné", r:"Imre anyja", loc:"imreanya", h:[7,21], bio:"78 éves, egyedül él a nyolcadikon. Gyerekkorodban zsíros kenyeret adott neked, amikor apád késő estig dolgozott.", topics:[
  {id:"imre", l:"Hol van Imre?", t:"„Két napja nem alszik itthon. A kiskertbe jár, az apja régi kertjébe, a Királyerdőbe. Vizet visz, sok vizet.” Elhallgat. „Mit csinált, Dénes?”", f:"bokszos_kert"},
  {id:"ildiko", l:"Lengyel Ildikóról", t:"„A vörös lány? Imre el akarta venni. Gyűrűt is vett neki, a fizetéséből.” Megtörli a szemét. „Aztán a lány eltűnt, és Imre azóta egyedül él. Huszonegy éve.”", ev:"bokszos_ildiko"}
 ]},
 lengyel:{n:"Lengyel Tamás", r:"Ildikó volt férje", loc:"lengyelhaz", h:[7,19], suspect:1, bio:"56 éves, autóbontó. 2006-ban ő volt a fő gyanúsított. Azóta nem iszik, és ezt minden második mondatában elmondja.", topics:[
  {id:"ildiko", l:"Ildikóról", t:"„Megtalálták. Hallottam.” Leül egy roncs motorháztetejére. „Rossz férj voltam. Ittam, ordítottam. Fenyegettem is. Kétszer feljelentett.” Felnéz. „De nem öltem meg. Huszonegy évig mindenki azt hitte, én voltam.”", f:"met_lengyel"},
  {id:"hol", l:"Hol volt aznap éjjel?", sober:1, t:"„Kórházban, főhadnagy. Kilenckor rosszul lettem, vakbél. A Szent Lászlóban műtöttek éjfélkor.” Kesernyésen elmosolyodik. „Akkor senki nem nézte meg. Maga megnézi?”"}
 ]},
 major:{n:"Major Gábor", r:"Ildikó egykori főnöke", loc:"major", h:[9,20], suspect:1, bio:"70 éves, nyugdíjas reklámügynökségi tulajdonos. Ősz, barna, tenisz és fehérbor. Húsz éve várja, hogy valaki megkérdezze.", topics:[
  {id:"viszony", l:"Ildikóról", t:"„Viszonyunk volt. A feleségem tudta. Mindenki tudta.” A medencét nézi. „Azt hittem, én vagyok a nagy szerelme. Aztán eltűnt.”", f:"met_major"},
  {id:"este", l:"Aznap este", sober:1, t:"„Fél tizenegykor felhívtam. Azt mondta: »Ma este megmondom Imrének, hogy vége. Utána hozzád jövök.«” Elcsuklik a hangja. „Nem jött. Huszonegy évig azt hittem, meggondolta magát.”", ev:["ildiko_szakit","major_hivas"]}
 ]},
 varga:{n:"Varga Ottó", r:"nyugalmazott alezredes", loc:"vargahaz", h:[8,21], gone:"varga_halott", bio:"56 éves, áprilistól nyugdíjas. Barnára sült, paradicsomot nevel, és most először látod úgy, hogy nem fáradt.", topics:[
  {id:"2006", l:"A 2006-os ügyről", t:"„Apád ügye volt. Én akkor kezdő voltam mellette.” Leteszi a metszőollót. „Egy reggel bejött, és lezárta. Azt mondta: nincs holttest, nincs ügy. Megkérdeztem, miért. Azt mondta: »Mert a fiam a tanú, Ottó.«” Rád néz. „Nem értettem. Most már érted, ugye?”"},
  {id:"bence", l:"Bencéről", t:"„A gyerek mindig olyan akart lenni, mint te.” Elhallgat. „Ne hagyd, hogy azzá váljon, amivé te.”"}
 ]},
 sanyi:{n:"Sanyi", r:"NA-gyűlés, szponzor", loc:"aa", h:[18,21], bio:"68 éves, huszonkét éve józan. Lassan beszél.", topics:[
  {id:"ul", l:"Leülsz a körbe", rep:1, mins:90, eff:{crave:-40}, dyn:"sanyiC5"}
 ]},
 lili:{n:"Mátrai Lili", r:"a lányod", loc:"otthon", h:[18,23], vis:"lili_marad", bio:"17 éves. Áprilistól nálad lakik. Esténként zongorázik, és ha rossz napod volt, hangosabban.", topics:[
  {id:"este", l:"Leülsz mellé", rep:1, dyn:"liliOtthon"}
 ]},
 apasir:{n:"Mátrai Gyula sírja", r:"apád", loc:"temeto", h:[7,20], vis:"apa_halal", bio:"Mátrai Gyula r. főhadnagy, 1952–2027.", topics:[
  {id:"beszel", l:"Beszélsz hozzá", rep:1, eff:{crave:-15}, t:"Leguggolsz a fejfa mellé. „Tudtad, apa. Huszonegy évig tudtad.” A tücskök ciripelnek. Arra gondolsz, hogy ő is itt guggolt volna, ha fordítva történik, és ugyanígy nem tudott volna mit mondani."}
 ]}
},

timed:[

 {id:"hirlap2", at:1440+420, front:{h:"Eltűnt egy fiatal nyomozó",s:"Tóth Bence vasárnap este óta nem adott életjelet",b:"A rendőrség nagy erőkkel keresi a 29 éves nyomozót, aki az Újpesti-öbölben talált autó ügyén dolgozott. Dr. Szép Viktória osztályvezető: „Minden emberünk őt keresi.”"}},
 {id:"eltunik", at:2*1440+360, unless:"bence_mentve", f:"bokszos_eltunt", x:"<b>Laci, SMS:</b> Imre tegnap este nem jött be. Ma reggel az anyja hívott, hogy nem aludt otthon. Szólok, hátha."},
 {id:"hoseg", at:2*1440+720, unless:"bence_mentve", x:"<b>Rádió:</b> Harmadfokú hőségriasztás. Ma 39 fokot mérnek, éjjel sem lesz 25 fok alatt."},
 {id:"halal", at:3*1440+720, unless:"bence_mentve", f:["bence_halott","bokszos_kert","bokszos_eltunt"], ev:["bence_test","kunyho_lakat"], modal:"<h2>Csütörtök, 12:00 – telefon</h2><p>Kata hangja. Először nem mond semmit, csak lélegzik. „Királyerdő. Egy kiskert, egy kunyhó. A kutyák találták meg.” Szünet. „Késő, Dénes. Reggel még élt. Azt mondják, reggel még élt.”</p><p>Leteszed a telefont. A hűtő zúg. A hűtőben nincs pálinka. Leülsz a konyha kövére, és vársz, hogy elmúljon. Nem múlik el.</p>"},
 {id:"nora", at:1440+1260, req:["nora_help"], modal:"<h2>Kedd, 21:00 – telefon, Szeged</h2><p>Nóra: „Láttam a hírekben a gyereket. A kollégádat.” Csend. „Megtalálod. Te mindig megtalálod őket. Csak néha későn.” Aztán: „Ma reggel a pékségben azt mondta egy vevő, hogy olyan vagyok, mint egy anyuka. Képzeld.”</p>"},
 {id:"becs", at:5*1440+360, req:["lili_elenged"], x:"<b>SMS, Lili:</b> Ma este 7-kor a záróhangverseny. Tudom, hogy nem tudsz jönni. De ha mégis: a vonat 9:40-kor indul a Keletiből."},
 {id:"vege", at:6*1440+1200, unless:"verd_all", pat:-500, modal:"<h2>Vasárnap, 20:00</h2><p>Az ügyet a sajtó nyomására átveszi egy másik csoport. Téged hazaküldenek. „Pihenjen, főhadnagy” — mondja Szép Viktória, és nem néz a szemedbe.</p>"}
],

    S.f.anna_egyutt=S.t;return'„Kilenc után végzek.” Kilenckor ott áll a kapud előtt, egy szatyor dinnyével, és azt mondja, hogy ebben a hőségben a rendőrök csak sört isznak, ezt is tudja a volt férjéről. „Te nem” — mondod. „Tudom” — mondja. „Azért jöttem.”';

 koccintas_talca:{var:"b", n:"Körbeadott tálca", d:"A videón: Ilona tálcán viszi körbe a kupicákat, mindenki maga vesz el egyet. Fodor a harmadikat veszi el, véletlenszerűen."},

 recept_gyors:{var:"b", n:"Két recept három hét alatt", d:"Kardos anyjának digoxinreceptjét szeptemberben háromhetes különbséggel kétszer váltották ki, két különböző patikában. Mindkétszer Kardos Péter vitte el.", sup:[["kardos","M"]]},

 kardos_inditek:{n:"300 millió és egy hétfő", d:"Fodor hétfőn feljelentette volna Kardost sikkasztásért. Ha vasárnapra meghal, nincs feljelentés, és a cég 300 milliót kap a biztosítótól.", sup:[["kardos","I"]], ded:true}
},

ded:[
 {a:"sarga_lat", b:"fodor_gyogyszer", g:"digoxin_gyanu", t:"Sárga fény a lámpák körül. Egy férfi, aki tíz éve digoxint szed. Apád egyszer azt mondta: a méreg a legintimebb fegyver. Közel kell lenni hozzá."},
 {a:"toxikologia", b:"adagolo", g:"nem_baleset", t:"Kilencszeres szint. Az adagolóból egyetlen rekesz üres. Fodor nem tévedett. Valaki más tévedett helyette."},
 {a:"audit", b:"kulcsember", g:"kardos_inditek", t:"Hétfő reggel feljelentés, vagy vasárnap reggel 300 millió. Kardosnak egy éjszakája volt, hogy válasszon."},
 {var:"a", a:"szilank_pozitiv", b:"kupica_atadas", g:"ilona_pohar", t:"A méreg a kupicában volt. A videón Ilona a bal kezéből adja Fodornak, nem a tálcáról. „Ez a férjemé volt.”"},
 {var:"a", a:"szilank_pozitiv", b:"gergo_vallomas", g:"ilona_pohar", t:"A méreg a kupicában volt. Gergő látta: Ilona a táskájából vette elő Fodor poharát."},
 {var:"a", a:"selejt", b:"szilank_pozitiv", g:"ilona_oldat", t:"Belsőleges oldat a pálinkában. Kilenc nappal korábban egy ilyen üveg „eltört” Ilona patikájában. Ő selejtezte. Senki nem látta a szilánkokat."},
 {var:"a", a:"ilona_level", b:"ilona_inditek", g:"ilona_bosszu", t:"Tizenhét évig azt hitte, a férje rosszul gazdálkodott. Szeptemberben megtalálta a levelet. A lánya októberben Fodor fiához ment feleségül."},
 {var:"b", a:"kapszula", b:"anya_kapszula", g:"kardos_kapszula", t:"Üres kapszulák az anyja fiókjában, fogyó tabletták. Kardos minden hónapban elhozza a gyógyszereit. Szeptemberben kétszer."},
 {var:"b", a:"kapszula", b:"recept_gyors", g:"kardos_kapszula", t:"Porított digoxin egy kapszulában. Kardos szeptemberben két patikában váltotta ki az anyja receptjét, három hét különbséggel."},
 {var:"b", a:"kapszula", b:"foto_zako", g:"kardos_zako", t:"21:34, a nyitótánc. Kardos keze a zakóban. 22:00, Fodor bevette a szombat esti rekeszt. Egy kapszulát, amit soha nem szedett."},
 {var:"b", a:"kapszula", b:"gergo_vallomas", g:"kardos_zako", t:"A pincér látta: a nyitótánc alatt Kardos a zakó zsebében kotorászott. Fél órával később Fodor bevette a gyógyszerét."}
],

docs:{
 boncolas6:{t:"Boncolási jegyzőkönyv – Fodor Ákos", b:"IGAZSÁGÜGYI ORVOSTANI INTÉZET\nBoncolt: dr. Keleti Mária\n\nNév: Fodor Ákos, 61 é.\nKórelőzmény: pitvarfibrilláció, tartós digoxinkezelés (0,25 mg/nap).\n\nSzív: mérsékelten megnagyobbodott, friss elhalás nincs. Koszorúerek: szűkület nincs. Ez nem szívroham.\n[[toxikologia|Toxikológia: szérum-digoxin 18 ng/ml (terápiás tartomány 0,8–2,0). Kálium emelkedett. Halál oka: digoxinmérgezés okozta kamrai ritmuszavar.]]\nGyomortartalom: alkohol, vacsoramaradvány, tablettamaradvány nem azonosítható.\nA bevitel ideje a tünetek alapján 21:30 és 23:00 között valószínű.\n\n— K. M., kézzel: „Kilencszeres, Dénes. Ezt nem lehet véletlenül. És nem lehet hosszan tervezni sem. Valaki tudta, mit szed.”"},
 szilank_labor:{t:"Laborjelentés – kupicaszilánkok", b:{$v:{
  a:"BŰNÜGYI TECHNIKAI LABOR\nVizsgálta: Halász Tamás\n\nMinta: ólomkristály kupica szilánkjai (11 db), a Malomkert konyhai hulladékából.\nUjjnyomat: Fodor Á., részleges, a talpon.\n[[szilank_pozitiv|A belső felületen beszáradt maradvány: etanol, birsalma-aromák, valamint nagy koncentrációban digoxin, propilénglikol és metil-parahidroxibenzoát. Ez utóbbiak a belsőleges digoxinoldat segédanyagai. Tablettából nem származhat.]]\n\n— H. T.: „Valaki folyékony digoxint öntött a pálinkába, Dénes. Ilyet nem kapsz a sarki boltban. Patika kell hozzá.”",
  b:"BŰNÜGYI TECHNIKAI LABOR\nVizsgálta: Halász Tamás\n\nMinta: ólomkristály kupica szilánkjai (11 db), a Malomkert konyhai hulladékából.\nUjjnyomat: Fodor Á., részleges, a talpon.\n[[pohar_tiszta|A belső felületen beszáradt maradvány: etanol, birsalma-aromák. Digoxin, egyéb gyógyszerhatóanyag nem mutatható ki.]]\n\n— H. T.: „Tiszta pálinka. Jó pálinka egyébként. A méreg nem itt ment le, Dénes.”"}}},
 adagolo_labor:{t:"Laborjelentés – heti gyógyszeradagoló", b:{$v:{
  a:"BŰNÜGYI TECHNIKAI LABOR\nVizsgálta: Halász Tamás, konzultáns: dr. Keleti Mária\n\nMinta: hétrekeszes műanyag gyógyszeradagoló, Fodor Á. zakójából.\nRekeszek: hétfő–szombat reggel üres (bevett adagok). Szombat este: üres.\n[[adagolo_rendben|Vasárnap reggel, vasárnap este: 1-1 db 0,25 mg-os Lanoxin tabletta, gyári bevonat, sértetlen. A tabletták összetétele és mennyisége megfelel a rendeltnek.]]\nUjjnyomatok: Fodor Á., Fodorné R.\n\n— H. T.: „Az adagoló rendben van. Amit este tízkor bevett, az a saját gyógyszere volt.”",
  b:"BŰNÜGYI TECHNIKAI LABOR\nVizsgálta: Halász Tamás, konzultáns: dr. Keleti Mária\n\nMinta: hétrekeszes műanyag gyógyszeradagoló, Fodor Á. zakójából.\nRekeszek: hétfő–szombat reggel üres (bevett adagok). Szombat este: üres.\n[[kapszula|Vasárnap reggel: 1 db átlátszó zselatinkapszula, 00-s méret. Tartalma: 2,4 mg porított digoxin, laktóz, burgonyakeményítő: összetört tabletták. Vasárnap este: 1 db 0,25 mg-os Lanoxin tabletta, gyári.]]\nUjjnyomatok: Fodor Á., Fodorné R. A kapszulán nincs értékelhető nyom.\n\n— H. T.: „Valaki kicserélte a hétvégi adagot. Biztos, ami biztos, kettőt is. Ha a szombat esti nem öli meg, a vasárnap reggeli igen.”"}}},
 video:{t:"Videófelvétel – pohárköszöntő, 22:44–22:49", b:{$v:{
  a:"LUKÁCS BÁLINT – esküvői videó, nyers anyag, 3. kamera\n\n22:44 Fodor Ákos feláll, megkocogtatja a poharát. A terem elcsendesedik.\n22:45 Sárközi Ilona egy ezüsttálcával a főasztalhoz lép. A tálcán öt kristálykupica.\n[[kupica_atadas|22:45:20 Ilona a tálcáról kiosztja az öt kupicát: Réka, Kardos, Dóra, a saját helye, Márk helye (üres). A hatodikat a bal kezéből adja át Fodornak. Valamit mond, a hang nem érthető. Fodor elmosolyodik, koccint, és egy hajtásra kiissza. A poharat senki más nem érinti.]]\n22:47 Fodor beszéde: „…a régi sérelmeket ma eltemetjük…” Taps.\n[[mark_alibi|22:46 Márk a színpadon, a zenekarnál áll, a poharát a dobos tartja. Nem jön le a beszéd végéig.]]",
  b:"LUKÁCS BÁLINT – esküvői videó, nyers anyag, 3. kamera\n\n22:44 Fodor Ákos feláll, megkocogtatja a poharát. A terem elcsendesedik.\n22:45 Sárközi Ilona egy ezüsttálcával a főasztalhoz lép. A tálcán hat kristálykupica.\n[[koccintas_talca|22:45:20 Ilona körbeviszi a tálcát, mindenki maga vesz el egy kupicát. Fodor a harmadikat veszi el, Réka után, oda se nézve. Ilona a tálcát leteszi, és utolsóként veszi el a sajátját.]]\n22:47 Fodor beszéde: „…a régi sérelmeket ma eltemetjük…” Taps.\nA felvétel 22:49-kor megszakad: elfogyott a kártya."}}},
 fotok:{t:"Fotóválogatás – Malomkert, 21:00–22:30", b:{$v:{
  a:"Válogatta: a stáb, a fotós 2140 képéből. Megjegyzések a margón.\n\n21:30–21:45 nyitótánc. A vendégek a parkett körül.\n[[kardos_terasz|21:20–22:15: Kardos Péter a teraszon, a fotóssal szivarozik, egy üveg whisky mellett. 14 kép, időbélyeggel. A nyitótánc alatt nincs a teremben.]]\n[[mark_alibi|21:30–21:45: Márk végig a parketten, a menyasszonnyal, utána az anyósával táncol.]]\n22:00: Fodor a főasztalnál, egy pohár vízzel, a tenyerében egy tabletta. Réka nézi.",
  b:"Válogatta: a stáb, a fotós 2140 képéből. Megjegyzések a margón.\n\n21:30–21:45 nyitótánc. A vendégek a parkett körül, mindenki a pár felé néz.\n[[foto_zako|21:34:12, a 0871-es kép háttere, nagyítva: a főasztalnál Kardos Péter egyedül áll, a jobb keze Fodor széktámlára akasztott zakójának belső zsebében. A következő képen (21:34:40) már ül, és tapsol.]]\n[[mark_alibi|21:30–21:45: Márk végig a parketten, a menyasszonnyal. Egyetlen képen sincs a főasztal közelében.]]\n22:00: Fodor a főasztalnál, egy pohár vízzel, a tenyerében valami kicsi és átlátszó. Réka nézi."}}},
 selejt:{t:"Sárközi-patika – selejtezési és kábítószer-nyilvántartás", b:{$v:{
  a:"SÁRKÖZI GYÓGYSZERTÁR, Óbuda – belső nyilvántartás, 2027. szeptember\n\n09. 12. Insulin, 1 tollbetét, lejárt. Selejtezte: Varga B.\n[[selejt|09. 30. Digoxin belsőleges oldat 0,05 mg/ml, 60 ml, 1 üveg, eltört a raktárban. Selejtezte: Sárközi I. (A raktáros szerint aznap nem volt üvegtörés.)]]\n10. 04. Morfin, 1 amp., lejárt. Selejtezte: Varga B.",
  b:"SÁRKÖZI GYÓGYSZERTÁR, Óbuda – belső nyilvántartás, 2027. szeptember\n\n09. 12. Insulin, 1 tollbetét, lejárt. Selejtezte: Varga B.\n10. 04. Morfin, 1 amp., lejárt. Selejtezte: Varga B.\n[[patika_rendben|Digoxin (tabletta és belsőleges oldat): a készlet egyezik a forgalommal. Selejtezés április óta nem volt.]]"}}},
 recept:{t:"Vényadatok – Kardos Péterné", b:{$v:{
  a:"NEAK – vényforgalmi lekérdezés\nBeteg: Kardos Péterné, szül. 1945\n\nLanoxin 0,25 mg, 30 db: kiváltva 07. 08., 08. 07., 09. 06., 10. 05.\n[[recept_rendben|Havonta egyszer, mindig ugyanabban a zuglói patikában. Átvevő: Kardos Péter.]]",
  b:"NEAK – vényforgalmi lekérdezés\nBeteg: Kardos Péterné, szül. 1945\n\nLanoxin 0,25 mg, 30 db: kiváltva 07. 08., 08. 07., 09. 06.\n[[recept_gyors|09. 27. Lanoxin 0,25 mg, 30 db, kiváltva egy ferencvárosi patikában, ismétlő vényre. Átvevő: Kardos Péter.]]\nA háziorvos megjegyzése: „A beteg szerint a gyógyszere hamarabb fogy, mint kellene. Ellenőrizni.”"}}},
 audit_memo:{t:"Belső ellenőri jelentés – Fodor & Kardos Építő Kft.", b:"BIZALMAS – csak Fodor Á. ügyvezető részére\nKészítette: dr. Halmai E. könyvvizsgáló, 2027. 09. 24.\n\nA 2024–2027 közötti alvállalkozói kifizetések vizsgálata.\n[[audit|Három nem létező alvállalkozó (Duna-Mérnök Bt., KP-Gépház Kft., Rév-Bau Kft.) részére összesen 140 millió Ft kifizetés. Utalványozó minden esetben: Kardos Péter.]]\n\nFodor Á. kézírása a lap alján: „Péter. Hétfő reggel 9-ig. Utána nem én döntök.”"}
},

 kuria:{m:"Malomkert", n:"Malomkert rendezvényház, Római-part", x:400, y:62, side:"B", crime:1, d:"A régi vízimalomból lett rendezvényház. A teremben fehér abroszok, félig evett torták, egy lufi a plafonon. A teraszon túl a Duna fekete, mint az olaj.", hs:[
   {id:"foasztal", l:"A főasztal", t:"Ültetőkártyák kalligráfiával. Fodor Ákos a közepén. Balján a felesége, Réka, jobbján Kardos Péter, a násznagy. Szemben a menyasszony anyja, Sárközi Ilona. Fodor zakója még mindig ott lóg a széktámlán, Kardos széke felé fordulva.", ev:"ultetes"},
   {id:"zako", l:"Fodor zakója", t:"A belső zsebben egy hétrekeszes gyógyszeradagoló, a fedelén filccel: Á. A szombat esti rekesz üres, a vasárnapiakban még van valami. A másik zsebben szivar, egy cetli a pohárköszöntő szövegével: „…a régi sérelmeket ma eltemetjük…”", ev:"adagolo"},
   {id:"parkett", l:"Ahol összeesett", t:"A parkettán egy szék felborítva, egy terítő félig lehúzva. Üvegszilánk nincs, valaki már felsöpörte. Egy beszáradt pálinkafolt, birsalmaszagú.", f:"szilank_hol"},
   {id:"kuka", l:"A konyhai szemetes", req:["szilank_hol|met_gergo","!szemet_el"], t:"A konyhai hulladékgyűjtő tetején, a tortamaradékok közt egy összesöpört kupac: kristályszilánkok, egy kupica talpa egészben. Kesztyűvel kiszeded, zacskóba teszed.", ev:"szilank"},
   {id:"kuka_ures", l:"A konyhai szemetes", req:["szemet_el","!szilank"], t:"A hulladékgyűjtő üres, kimosva. Hétfő reggel hatkor jött a kukásautó."},
   {id:"oltozo", l:"Személyzeti öltöző", req:["gergo_ideges"], t:"A pincérek szekrényei. Gergőé nyitva felejtve: a kabátja zsebében egy borítékban tizenkét kis zacskó fehér por, és egy füzet nevekkel és összegekkel. A lakodalmi menü mellé ez is járt, aki tudott róla.", f:"gergo_kokain"}
 ]},

 hordo:{m:"Hordó", n:"Hordó", x:648, y:462, side:"P", open:[15,3], d:"A Hordóban a sarokasztal üres. Laci nem ültet oda senkit. A nyerőgép villog, a rádióban egy régi Omega-szám.", hs:[]},

 ilonahaz:{la:1, m:"Sárközi-patika", n:"Sárközi-patika és lakás, Óbuda", x:430, y:150, side:"B", vis:"met_ilona_k|ilona_inditek", d:"Egy régi óbudai ház földszintjén a patika, fölötte a lakás. A pult mögött barna üvegek, a falon egy bekeretezett gyógyszerészi oklevél 1995-ből. Fent egy férfi fényképe, gyászszalaggal, tizenhét éve.", hs:[
   {var:"a", id:"iroasztal", l:"A férje íróasztala", req:["met_ilona"], t:"Az íróasztalon por, kivéve egy helyen, ahol nemrég valaki egy dobozt nyitott ki. A dobozban levelek, a legfelső borítékon nincs bélyeg. Sárközi Gábor kézírása, 2010. február: egy bankos ismerős neve, egy összeg, és egy mondat: „Ákos fizetett neki, hogy felmondják.” Soha nem küldte el.", ev:"ilona_level"},
   {var:"b", id:"iroasztal", l:"A férje íróasztala", req:["met_ilona"], t:"Az íróasztalon por és fényképek. Sárközi Gábor egy építkezésen, sisakban, mellette egy fiatal Fodor Ákos, átkarolják egymást. 2005. A hátoldalon Ilona kézírása: „Megbocsátok. Dórának.” Tavalyi dátum."},
   {id:"kupicak", l:"A kupicakészlet", req:["met_ilona"], t:"A vitrinben egy ólomkristály kupicakészlet, hat helyből öt foglalt. A hatodik helyén por nincs. Mellette egy fél üveg birspálinka, kézzel írt címkével: Gábor, 2009."}
 ]},
 fodorvilla:{la:1, m:"Fodor-villa", n:"Fodor-villa, Pasarét", x:300, y:262, side:"B", vis:"met_reka_k", d:"Kertes villa, kovácsoltvas kapu, a kapubejáróban két terepjáró. A nappaliban még ott vannak a lakodalmi ajándékok, kibontatlanul. Réka a kanapén ül, és a telefonját nézi, ami nem csörög.", hs:[]},
 kardosiroda:{la:1, m:"Fodor & Kardos", n:"Fodor & Kardos Építő Kft., Váci út", x:648, y:110, side:"P", vis:"met_kardos_k|audit", d:"Üvegirodaház a Váci úton, a hatodik emeleten. A recepción gyászkeretes fénykép, alatta egy csokor, amit valaki a portán hagyott. Fodor irodájának ajtaja zárva, Kardosé nyitva.", hs:[
   {id:"szef", l:"Fodor irodája – a széf", req:["reka_kulcs"], t:"A falba épített széf Réka kódjára kinyílik. Benne: egy biztosítási kötvény, egy bizalmas jelentés, és egy régi fénykép egy borítékban. 1994, egy komp fedélzete. A Révész. A fiatal Fodor Ákos, mellette Vámos Lajos, a révész, egy kapitánysapkás férfi, és egy negyedik, akinek az arcát valaki ollóval, gondosan kivágta. A hátoldalon ceruzával: „Mindenki megkapta a részét.”", ev:["kulcsember","foto1994"], doc:"audit_memo", f:"foto1994"}
 ]},
 naszlakas:{m:"Nászlakás", n:"A fiatal pár lakása, Újlipótváros", x:545, y:152, side:"P", vis:"met_mark_k|met_dora_k", d:"Frissen festett kétszobás, a dobozok még nincsenek kipakolva. Az előszobában a menyasszonyi ruha egy fogason, mint egy szellem. Márk az erkélyen dohányzik, pedig Dóra szerint leszokott.", hs:[]},
 kardosanya:{la:1, m:"Kardosné", n:"Kardos Péterné lakása, Zugló", x:900, y:405, side:"P", vis:"kardos_anya_hol|kardos_anya", d:"Zuglói kockaház, a kertben ősszel is rózsák. Kardos Péterné nyolcvankét éves, botra támaszkodva nyit ajtót, és megkérdezi, kér-e a rendőr úr pogácsát.", hs:[
   {var:"a", id:"doboz", l:"A gyógyszeres doboz", req:["met_kardosne"], t:"A konyhaszekrényben egy cipősdoboz, benne a gyógyszerek, hetekre kiosztva, egy unoka gondos kézírásával. A Lanoxin doboza félig, a dátum stimmel. Minden rendben."},
   {var:"b", id:"doboz", l:"A gyógyszeres doboz", req:["met_kardosne"], t:"A konyhaszekrényben egy cipősdoboz. A Lanoxin dobozában négy tabletta maradt, pedig a címke szerint két hete váltották ki. Mellette egy bontott doboz, gyógyszertári: üres zselatinkapszulák, 00-s méret, száz darab, hiányzik belőle néhány.", ev:"anya_kapszula"}
 ]},
 studio:{la:1, m:"Videóstúdió", n:"Lukács Bálint stúdiója, Ferencváros", x:704, y:560, side:"P", vis:"videos_nev", open:[10,20], d:"Pinceműhely a Ráday utcában, monitorok, merevlemezek, egy kanapé, amin láthatóan valaki alszik. A falon esküvői képek: boldog emberek, akik közül azóta néhányan elváltak.", hs:[]},
 vendeglo6:{la:1, m:"Vendéglő", n:"Kéményseprő vendéglő, Buda", x:378, y:332, side:"B", vis:"anna_vacsora_hiv6", gone:"anna_vacsora6|anna_vacsora_rossz6", open:[19,23], d:"Kockás abrosz, cserépkályha, már be is gyújtottak. A pincér úgy néz rád, mintha ismerne.", hs:[]},
 zeneakademia6:{la:1, m:"Zeneakadémia", n:"Zeneakadémia, Solti terem", x:640, y:246, side:"P", vis:"lili_marad", open:[14,17], day:3, d:"Szerda délután, felvételi előmeghallgatás. A folyosón tizenhét éves zongoristák ülnek kottával a térdükön, és egyikük sem néz a másikra.", hs:[]},
