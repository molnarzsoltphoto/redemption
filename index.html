people:{
 varga:{n:"Varga Ottó alezredes", r:"osztályvezető", loc:"kapitanysag", h:[7,19], gone:"v4_found", bio:"56 éves, a gyilkossági osztály vezetője. 2019-ben még őrnagyként vezette a csepeli benzinkutas-ügyet. Fáradtabb, mint egy hónapja, és többet nyúl a fiókhoz.", topics:[
  {id:"elig", l:"Eligazítás", t:"„Szalai Endre, hatvannyolc, tizenöt éve nyugdíjas bíró. Pénztárca, óra hiányzik. A veje, Lévai Márk ügyvéd, nyakig adósságban.” Leveszi a szemüvegét. „Somogyi rablást akar, gyorsan, karácsony előtt. Én azt akarom, hogy igazad legyen.”", f:"briefed"},
  {id:"2019", l:"A 2019-es Rajna-ügyről", req:["rajna_ugy|rajna_lista"], t:"Sokáig hallgat. „Benzinkutas-gyilkosság Csepelen. Kónya hozta a tanút, a lány felismerte Rajnát. Szalai elítélte.” Az ablakhoz megy. „A fiú végig tagadott. Mindegyik tagad, Dénes.” Nem néz rád. „Volt, hogy nem aludtam miatta.”", f:"varga2019"},
  {id:"vedelem", l:"Figyelmezteted: rajta van a listán", req:["rajna_lista|pentek"], t:"„Engem? Egy csepeli villanyszerelő?” Felnevet, aztán abbahagyja. „Jó. Küldj ki valakit a házhoz, ha nyugodtabb leszel tőle. De a Stábon keresztül, papíron. Nem akarok szívességet.”", f:"varga_tud"},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, dyn:"vargaStatus"}
 ]},
 somogyi:{n:"Somogyi Kristóf", r:"főkapitány-helyettes", loc:"kapitanysag", h:[8,18], vis:"v3_found", bio:"45 éves, fotogén, politikai kapcsolatokkal. Kónya halála óta személyesen „koordinálja” a gyűrűsujjas ügyet. A háta mögött mindig ott áll Halmos.", topics:[
  {id:"beszel", l:"Beszélsz vele", t:"„Mátrai. Egy sorozatgyilkos öli a város igazságszolgáltatását. Bíró, tanú, rendőr. Ugyanaz az ember, ugyanaz a jel.” Megigazítja a nyakkendőjét. „Hozza be a csepeli fiút, és karácsonyra mindenki otthon lehet. A három gyilkossággal együtt.”", f:"somogyi_ugyanaz"},
  {id:"halmos", l:"Halmosról kérdezed", req:["belso_ember|halmos_konyanal|kata_titok"], t:"A mosoly nem tűnik el, csak megfagy. „Halmos az én emberem. Szerda éjjel velem volt. Ha ezt kétségbe vonja, engem von kétségbe.” Feláll. „Rácz Gábor is mindig kérdezett, főhadnagy. Emlékszik, hogy végződött.”", pat:-10, f:"somogyi_fenyeget"},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, req:["v4_found"], dyn:"vargaStatus"}
 ]},
 halmos:{n:"Halmos Péter", r:"Somogyi kísérője", loc:"kapitanysag", h:[8,18], vis:"v3_found", bio:"46 éves, magas, kopasz, csendes. Tizenkét évig a terrorelhárításnál szolgált, most Somogyi sofőrje, testőre és árnyéka. 2020-ban ott volt a csepeli rajtaütésen.", topics:[
  {id:"ki", l:"Kónyát ismerte?", t:"„Együtt szolgáltunk. Jó ember volt.” A hangja semleges, mint egy jelentés. „Remélem, elkapják, aki ezt tette vele.” Nem pislog."},
  {id:"mult", l:"A múltjáról", t:"„Tizenkét év terrorelhárítás. Közelharc-oktató voltam.” Megmozgatja a nyakát. „Most autót vezetek. Kevesebb a papírmunka.”", ev:"halmos_tek"},
  {id:"szerda", l:"Hol volt szerda éjjel?", sober:1, t:"„Somogyi úrral. A lakásán, reggelig. Megbeszélés.” Ennyi. Nem magyaráz, nem siet. Aki hazudik, az általában többet beszél. Ő nem.", f:"halmos_alibi"},
  {id:"cella", l:"Szembesít: a telefonja Újpesten", req:["halmos_cella"], sober:1, t:"Hosszan néz. „A telefonom sok helyen jár.” Aztán halkabban: „Kónya barátom volt, főhadnagy. Barátok között is vannak tartozások.”"},
  {id:"racz", l:"Szembesít: Rácz Gábor", req:["baratsagos_tuz"], sober:1, t:"Most először változik meg az arca. Egy pillanatra, nem tovább. „Rácz Gábor rossz helyen állt. Sötét volt, lőttek. Ilyen a háború.” Közelebb hajol. „Maga hat évig azt hitte, hogy maga ölte meg. Jól aludt?”"}
 ]},
 bence:{n:"Tóth Bence", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"29 éves, lelkes, jó papíron és a rendszerekben. Az utcán még tanul. Mióta a Révész-ügyben dolgoztatok, minden reggel kávét hoz neked, kérés nélkül.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintBence"}
 ]},
 kata:{n:"Rácz Kata", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"36 éves, az osztály legélesebb esze. Rácz Gábor lánya, akit 2020-ban a csepeli rajtaütésen veszítettél el. Hat éve dolgozik melletted, és hat éve nem beszélt veled az apjáról.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintKata"},
  {id:"titok_low", l:"Mi van veled, Kata?", req:["v3_found","!loy:kata:65","!kata_titok"], rep:1, t:"Ránéz a kezére, aztán rád. „Majd ha megbízom benned, Mátrai. Ma még nem.” Visszafordul a monitorhoz. <i>(Kata lojalitása még nem elég.)</i>"},
  {id:"titok", l:"Mi van veled, Kata?", req:["v3_found","loy:kata:65"], t:"Sokáig hallgat. Aztán bezárja az iroda ajtaját. „Hat éve azt hiszed, a te parancsod ölte meg apámat. Mindenki ezt hiszi. Én is ezt hittem.” Az asztalodra tesz egy kartondobozt. „Nem a te parancsod volt, Dénes. És nem a gyanúsítottak lőttek. Kónya tudta. És most Kónya halott.” A hangja nem remeg. Csak a keze.", doc:"kata_akta", f:"kata_titok"}
 ]},
 bodnar:{n:"Bodnár Feri", r:"törzszászlós", loc:"kapitanysag", h:[7,21], staff:1, bio:"58 éves, huszonöt éve jár utcára. Az informátorai mindent tudnak a VIII. kerületről. Gazsiról többet, mint Gazsi saját magáról.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintBodnar"}
 ]},
 halasz:{n:"Halász Tamás", r:"nyomszakértő", loc:"kapitanysag", h:[8,22], staff:1, bio:"41 éves, pedáns. Decemberben a laborban karácsonyi Omega-válogatást hallgat, és ezt nem tartja ellentmondásnak.", topics:[
  {id:"gond", l:"Mi van a laborban?", rep:1, dyn:"hintHalasz"}
 ]},
 feher:{n:"Dr. Fehér Judit", r:"pszichológus, profilozó", loc:"kapitanysag", h:[9,17], staff:1, bio:"52 éves. Profilt készít, és ő dönt a szolgálati alkalmasságodról. Ezen a héten kötelező beszélgetésre vár.", topics:[
  {id:"alkalmassag", l:"Az alkalmassági beszélgetés", req:["feher_hivas"], dyn:"feherUles"},
  {id:"jel", l:"A gyűrűsujjról kérdezed", req:["ugyanaz_a_jel"], t:"„A gyűrűsujj az eskü ujja. Az esküvőé, de a tanúé is, aki megesküszik, és a bíróé, aki aláír.” Leveszi a szemüvegét. „Az ilyen tettesnek listája van, főhadnagy. És a listák végén mindig az áll, aki a legfeljebb ült.”"}
 ]},
 keleti:{n:"Dr. Keleti Mária", r:"igazságügyi orvosszakértő", loc:"intezet", h:[7,19], staff:1, bio:"61 éves, cinikus, láncdohányos. Apád egykori kollégája. Decemberben mindig többet dohányzik, mert azt mondja, a halottak is többen vannak.", topics:[
  {id:"elozetes", l:"Előzetes vélemény", req:["body1"], t:"„Egy ütés, hátulról. Nem rabló, Dénes. A rabló kétszer üt, vagy háromszor, és fél. Ez nem félt. Ez végrehajtott valamit.” Kifújja a füstöt. „A boncolás után többet mondok. Van valami az ujján.”"},
  {id:"elosztas", l:"Ki kapta meg az első boncolást?", req:["doc:boncolas1"], t:"Előveszi a nyilvántartást. „Varga, te, az irattár. És Somogyi irodája, mert ő kérte, a sajtó miatt.” Rád néz a szemüvege fölött. „A kötözőt egyik újság sem írta meg. Én megnéztem.”", ev:"elosztas"},
  {id:"apa", l:"Apámról", t:"„Hétfőn voltam nála. Rosszabbul van, Dénes. A lépcsőn már nem mer lemenni.” Elnyomja a cigit. „Délelőtt menj. Amíg még megismer.”"}
 ]},
 apa:{n:"Mátrai Gyula", r:"az apád", loc:"platan", h:[9,19], gone:"apa_korhaz", bio:"74 éves, nyugalmazott rendőr főhadnagy, kezdődő demenciával. Délelőttönként még tiszta, de egyre rövidebb ideig.", topics:[
  {id:"racz", l:"A Rácz-temetésről kérdezed", lucid:[9,11], t:"Sokáig nézi a havat az ablakon túl. „A Rácz fiú temetésén Kónya Attila részeg volt. Odajött hozzám. Azt mondta: »Gyula bácsi, a lövés nem Dénes felől jött.« Aztán elsírta magát, és elment.” Megfogja a kezed. „Hat éve el akarom mondani neked. Mindig elfelejtem.”", ev:"apa_konya", f:"apa_racz"},
  {id:"beszel", l:"Csak leülsz mellé", rep:1, dyn:"apaTalk"}
 ]},
 apa2:{n:"Mátrai Gyula", r:"az apád", loc:"korhaz", h:[8,20], vis:"apa_korhaz", bio:"Combnyaktörés. Holnap műtik. A morfiumtól hol tiszta, hol a régi rádiós műsorok szignálját dúdolja.", topics:[
  {id:"racz", l:"A Rácz-temetésről kérdezed", req:["!apa_racz"], lucid:[8,11], t:"A morfium mögül néz ki rád. „A Rácz fiú temetésén Kónya részeg volt. Azt mondta: »A lövés nem Dénes felől jött.« Hat éve el akarom mondani.” Elalszik, mielőtt bármit kérdezhetnél.", ev:"apa_konya", f:"apa_racz"},
  {id:"marad", l:"Mellette maradsz egy órát", rep:1, mins:60, eff:{crave:-15}, dyn:"apaKorhaz", f:"apa_latogatas"}
 ]},
 lili:{n:"Mátrai Lili", r:"a lányod", loc:"trattoria", h:[18,22], bio:"Ma tizenhét éves. Zongorázik, sokat olvas, és ha haragszik rád, udvarias. Az anyja mellette ül, és figyel.", topics:[
  {id:"ott", l:"Leülsz az asztalhoz", dyn:"liliBday", mins:90},
  {id:"ajandek", l:"Átadod az ajándékot", req:["ajandek","lili_bday"], t:"Kibontja. Chopin-noktürnök, Paderewski-kiadás. Lapozgatja, és megáll annál, amit két hete a koncerten játszott. „Ezt honnan tudtad?” Nem mondod meg, hogy két órát álltál a boltban. Nem is kell.", f:"lili_ajandek"}
 ]},
 nora:{n:"Nóra", r:"régi ismerős", loc:"nora", h:[20,4], gone:"nora_help", bio:"31 éves. Még mindig Gazsinak dolgozik, és még mindig ki akar szállni. A VIII. kerületben mindenkit ismer, aki éjszaka él.", topics:[
  {id:"ora", l:"Maradsz nála egy órát (8 000 Ft)", rep:1, cost:8000, mins:60, eff:{crave:-25}, dyn:"noraTalk"},
  {id:"kitti", l:"Vass Kittiről kérdezed", req:["v2_found"], t:"Elsápad. „Kitti? Együtt kezdtük, tizenkilenc évesen.” Rágyújt. „2019-ben egy zsaru pénzt adott neki, hogy felismerjen valakit a bíróságon. Kónyának hívták. Kitti azóta nem aludt rendesen. Azt mondta, egy ártatlan embert küldött börtönbe.”", ev:"kitti_konya"}
 ]},
 szalaine:{n:"Szalai Endréné", r:"az özvegy", loc:"szalai", h:[8,22], bio:"Margit, 66 éves, nyugdíjas zongoratanár. Egyenes háttal ül, a kezét az ölében tartja, és csak akkor sír, ha azt hiszi, senki nem látja.", topics:[
  {id:"vasarnap", l:"Hova ment a férje vasárnap este?", sober:1, t:"„Azt mondta, találkozója van. Hogy rendbe kell tennie valamit, ami régóta nyomja.” Lenéz a kezére. „Pénteken hívta egy fiatalember. Endre utána egész este a dolgozószobában ült, és egy régi ítéletet olvasott.”", f:"telefonalo"},
  {id:"level", l:"A névtelen borítékról", req:["itelet_boritek"], t:"„Két hete jött. Endre megmutatta. Azt mondta: »Margit, azt hiszem, abban az ügyben tévedtem. Kónya hozta azt a lányt, és én elhittem.«” Megtörli a szemét. „Azt mondta, bocsánatot fog kérni. Negyven év alatt soha nem kért bocsánatot.”"},
  {id:"marki", l:"Lévai Márkról", t:"„A vejem.” Ennyit mond, de úgy, hogy abban minden benne van. „A lányom szereti. Endre nem szerette. Pénzt kért tőle, sokat. Endre nem adott.”", ev:"orokseg"}
 ]},
 levai:{n:"Dr. Lévai Márk", r:"Szalai veje, ügyvéd", loc:"szalai", h:[8,22], suspect:1, bio:"41 éves, ügyvéd, jó öltöny, rossz cipő. Két éve vesztett el egy nagy pert, azóta egy belvárosi kaszinóban veszíti a többit. Folyton a telefonját nézi.", topics:[
  {id:"hol", l:"Hol volt vasárnap este?", t:"„Otthon. A feleségemmel. Filmet néztünk.” Túl gyorsan mondja. A felesége a konyhában leejt egy kanalat.", f:"levai_hazudik"},
  {id:"penz", l:"A pénzügyeiről", t:"Megigazítja a mandzsettáját. „Átmeneti likviditási gondok. Mint mindenkinek.” Kinyitja a száját, aztán becsukja. „Ha arra céloz, hogy az apósom halála jól jön nekem, főhadnagy, akkor beszéljen az ügyvédemmel. Vagyis velem.”", ev:"orokseg"},
  {id:"audi", l:"Szembesít: az Audija a hídnál", req:["levai_auto"], sober:1, t:"Elsápad. Leül. „Jó. Ott voltam. De nem miatta. Fizetnem kellett valakinek, egy uzsorásnak, a híd alatt, fél tizenkettőkor.” Megtörli a homlokát. „Amikor odaértem, egy biciklis férfit láttam, aki a lépcsőn tolta fel a biciklijét. Munkáskabát, olyan világítós csíkkal. Nem néztem meg jobban. Nem akartam, hogy ő is megnézzen engem.”", ev:"kerekparos", f:"levai_vallomas"},
  {id:"ki", l:"Ki volt az uzsorás?", req:["levai_vallomas"], t:"„Horváth Gáspár. Mindenki Gazsinak hívja.” Szégyelli magát, és ez az első őszinte dolog, amit látsz rajta. „Kétszázezret vittem neki. Kevés volt.”", f:"levai_gazsi"}
 ]},
 dori:{n:"Lakatos Dóra", r:"Kitti barátnője", loc:"kitti", h:[10,22], vis:"v2_found", bio:"23 éves, felszolgáló, Kitti legjobb barátnője. A gang korlátjába kapaszkodik, mintha a ház is mozogna.", topics:[
  {id:"tiszta", l:"Kitti drogozott?", sober:1, t:"„Nem! Egy éve tiszta volt, esküszöm. Hetente járt az ambulanciára, munkát keresett. Felszolgálónak jelentkezett hozzánk.” Sír. „Nem lőtte be magát. Nem tenné. Nem tette volna.”", ev:"kitti_tiszta"},
  {id:"gazsi", l:"Kinek tartozott?", t:"„Gazsinak. Háromszázezerrel, még a régi időkből. Gazsi szerint a kamat is tartozás.” Lehalkítja a hangját. „Kedden este itt volt, fél tíz körül. Dörömbölt, és azt ordította, hogy holnap már késő lesz. Kitti nem nyitott ajtót.”", ev:["kitti_tartozas","gazsi_lepcsohaz"]},
  {id:"2019", l:"A 2019-es tárgyalásról", req:["idezes_2019"], t:"Megdermed. „Arról soha nem beszélt. Egyszer, részegen, a régi időkben, azt mondta: »Dóri, én egy embert a sírba tettem, és még csak nem is ismertem.«” Megrázza a fejét. „Nem tudom, mit jelentett.”"}
 ]},
 simonne:{n:"Simon Lajosné", r:"szomszéd", loc:"kitti", h:[8,20], vis:"v2_found", bio:"79 éves, a gang másik végén lakik negyven éve. A kukucskálót úgy használja, mint más a tévét.", topics:[
  {id:"kedd", l:"Látott valakit kedden?", sober:1, t:"„Este hétkor jött egy villanyszerelő. Kedves fiú, megkérdezte, merre a villanyóra. Biciklivel jött, felhozta a lépcsőn, hogy el ne lopják.” Felemeli az ujját. „És tizenegy körül megint hallottam a biciklit a lépcsőházban. A csengő megpendült, ahogy a korlátnak ütődött.”", ev:"villanyszerelo"}
 ]},
 gazsi:{n:"Horváth „Gazsi” Gáspár", r:"uzsorás, strici", loc:"hordo", h:[21,3], vis:"v2_found", suspect:1, bio:"44 éves, arany lánc, puha hang. Pénzt kölcsönöz, lányokat futtat, és mindenkit „testvér”-nek szólít, akit meg akar fenyegetni.", topics:[
  {id:"kitti", l:"Vass Kittiről", t:"„Kitti? Szegény lány. Tartozott, ez igaz. De a halott nem fizet, testvér. Nekem élve kellett volna.” Mosolyog. „Gondoljon bele.”", f:"met_gazsi"},
  {id:"kedd", l:"Hol volt kedden éjjel?", t:"„Elmentem hozzá fél tízkor, nem nyitott ajtót. Utána idejöttem, és itt ültem zárásig. Kérdezze meg Lacit.” Bedob egy százast a gépbe. „Én mindig itt ülök, testvér.”"},
  {id:"levai", l:"Lévai Márkról", req:["levai_gazsi"], t:"Felnevet. „Az ügyvéd úr? Vasárnap fél tizenkettőkor a híd alatt kétszázezret hozott a háromszázból. Ketten voltak velem, láthatták.” Vállat von. „Láttam egy biciklis csávót is a lépcsőnél, mielőtt az ügyvéd odaért. Munkáskabát. Nem az én emberem.”", ev:"levai_tisztazva"}
 ]},
 laci:{n:"Laci", r:"kocsmáros", loc:"hordo", h:[15,3], bio:"A Hordó kocsmárosa, kor nélküli ember. Mindent hall, keveset mond. Decemberben fenyőágat tesz a pultra, és ez a legtöbb, amit ünnepnek hajlandó nevezni.", topics:[
  {id:"gazsi", l:"Gazsi kedd éjjel", req:["v2_found"], t:"„Kedden? Fél tíz után jött, leült a géphez, és zárásig ott ült. Háromkor küldtem haza.” Törölgeti a poharat. „Nem szeretem Gazsit. De kedden itt volt.”", ev:"gazsi_alibi"},
  {id:"pletyka", l:"Mit beszélnek?", t:"„Hogy a bírót kirabolták. Aki ismerte Szalait, nem hiszi. Csepelen azt mondják, Szalai régen sok fiatalt küldött be, akiknek nem kellett volna.”"}
 ]},
 bokszos:{n:"Szikszai „Bokszos” Imre", r:"gyerekkori barát", loc:"hordo", h:[19,2], bio:"47 éves, volt bokszoló, ma éjszakai portás. Ő az egyetlen, aki nem kérdezi, mikor hagyod abba.", topics:[
  {id:"rajna", l:"A Rajna fiúkról", req:["rajna_nev"], t:"„A Rajna gyerekek? A Csepeli Vasasban bokszoltak, a nagyobbik ügyes volt. Tamás. Aztán elvitték egy benzinkutas miatt, és a kicsi, Ádám, onnantól nem jött edzésre.” Iszik. „Villanyszerelő lett. Mindenhova biciklivel jár, télen is. Nem beszél senkivel.”", ev:"rajna_villany"},
  {id:"regi", l:"Csak iszol vele egyet (900 Ft)", rep:1, drink:1, dyn:"bokszosTalk"}
 ]},
 eszter:{n:"Gál Eszter", r:"bűnügyi újságíró", loc:"hordo", h:[18,23], bio:"38 éves, a Hírlap bűnügyi újságírója. Egyszer már hazudtál neki, ő kétszer neked. Ezen a héten fáradtabb, mint te.", topics:[
  {id:"konya", l:"Kónya keresett téged?", req:["v3_found"], t:"Leteszi a poharat. „Szerdán este írt. Csütörtök tízre beszéltünk meg találkozót. Azt mondta, mindent elhoz, 2019-et és 2020-at is. Somogyiról beszélt, Dénes. És rólad.” Hosszan néz. „Nem jött el. Most már tudom, miért.”", ev:"konya_eszter"},
  {id:"2020", l:"Mit tudsz a 2020-as rajtaütésről?", req:["konya_eszter"], t:"„Azt, amit mindenki. Rácz Gábor meghalt, te rossz parancsot adtál, Somogyi a vizsgálat után főkapitány-helyettes lett.” Elhallgat. „Kónya azt írta: »Dénes nem tehet róla.« Nem tudom, mit jelent. Szerintem te sem tudod.”"}
 ]},
 erika:{n:"Kónya Attiláné", r:"az özvegy", loc:"konya", h:[8,22], vis:"v3_found", bio:"Erika, 50 éves, ápolónő. Nem sír, csak a kezét dörzsöli, mintha fázna, pedig a konyhában meleg van.", topics:[
  {id:"szerda", l:"Mi történt szerdán?", sober:1, t:"„Este jött egy férfi. Magas, kopasz, a régi csapatából, fekete terepjáróval. Attila kiment hozzá az utcára, beszéltek, aztán az a férfi elhajtott.” Felnéz. „Attila utána egész este ivott. Éjfél után kiment a garázsba, azt mondta, levegőzik.”", ev:"fekete_terepjaro"},
  {id:"telefon", l:"Kivel beszélt mostanában?", sober:1, t:"„Szerdán délután telefonált. A nappaliban, de hallottam. Somogyi úrnak mondta: »Védelmet kérek, különben beszélek.«” Összeszorítja a száját. „Hat éve havonta pénz jött egy alapítványtól. Soha nem kérdeztem, miért.”", ev:"konya_somogyi"},
  {id:"felt", l:"Félt valamitől?", t:"„Hétfő óta. Amióta a bírót megtalálták. Azt mondta: »Erika, ez a 2019-es ügy. Én leszek a következő.«” Halkan felnevet, keserűen. „És igaza lett. Csak nem úgy, ahogy gondolta.”"}
 ]},
 kocsis:{n:"Kocsis Ilona", r:"irattáros", loc:"torvenyszek", h:[8,16], bio:"62 éves, harmincöt éve az irattárban. Minden ügyszámot fejből tud, és minden embert, aki valaha kikérte.", topics:[
  {id:"ugyszam", l:"Kikéred a B.18.451/2019-es iratot", req:["rajna_ugy|idezes_2019"], t:"„B.18.451/2019. Rajna Tamás.” Már indul is a polcok közé. „Furcsa. Ezt tavaly is kérte valaki. Egy fiatalember, munkásruhában. Nem adhattam ki neki.” Leteszi eléd a dossziét. „Magának kiadhatom. Szomorú ügy.”", doc:"per2019", f:["rajna_nev","rajna_cim"]},
  {id:"altalanos", l:"Szalai bíróról", t:"„Szalai bíró úr? Szigorú volt. Gyors. Azt mondták, negyven év alatt egyszer sem kért bocsánatot.” Elmosolyodik. „Tavaly karácsonykor hozott nekem egy szelet bejglit. Az ilyesmire is emlékszik az ember.”"}
 ]},
 rajna:{n:"Rajna Ádám", r:"villanyszerelő", loc:"rajna", h:[7,20], vis:"rajna_cim", gone:"rajna_elfogva", suspect:1, bio:"34 éves, csendes, alacsony, erős kezű. A műhelye rendes, mint egy kórterem. Úgy néz rád, mintha várt volna.", topics:[
  {id:"tamas", l:"A bátyjáról", t:"„Tamás nem ölt meg senkit. Négy évig mondta, minden hónapban, az üvegen keresztül.” Leteszi a csavarhúzót, pontosan a körvonalára a falon. „Aztán abbahagyta. Nem a mondást. Az életet.”"},
  {id:"hol", l:"Hol volt vasárnap, kedden és szerdán éjjel?", sober:1, t:"„Otthon. Egyedül. Mint minden este, mióta a bátyám meghalt.” Nem kérdez vissza, nem tiltakozik. „Ezt maga is tudja, főhadnagy.”", ev:"rajna_nincs_alibi"},
  {id:"szalai", l:"Szembesít: Szalai a hídnál", req:["rajna_hid|talalkozo|kalapacs_dns"], sober:1, t:"Sokáig hallgat. „Eljött. Azt hittem, nem jön el. Azt mondta, sajnálja. Hogy tévedett.” Lenéz a kezére. „Tudja, mit csinál az ember, ha négy év után valaki azt mondja, sajnálja? Semmit. Mert késő.”"},
  {id:"kitti", l:"Szembesít: Kitti", req:["rajna_kitti|kenyszer"], sober:1, t:"„Teát főzött nekem. Sírt. Azt mondta, minden éjjel látja Tamást a bíróságon.” A hangja nem változik. „Én is látom. Minden éjjel.”"},
  {id:"konya", l:"Szembesít: Kónya", req:["v3_found"], sober:1, t:"Most először néz rád igazán. „Kónyát nem én öltem meg.” Csend. „Valaki megelőzött, főhadnagy. Valaki, aki tudott a gyűrűről. Ki tudott a gyűrűről? Maga tudott. A maga emberei tudtak.” Visszafordul a munkapadhoz. „Keresse meg. Maga a rendőr.”", ev:"rajna_nem_konya"}
 ]}
},

 {id:"hirlap1", at:1860, front:{h:"Kirabolták és megölték Szalai bírót",s:"A nyugalmazott bíró holttestét a Vámház-hídnál találták meg",b:"Somogyi Kristóf főkapitány-helyettes szerint rablógyilkosság történt. „A tettest karácsony előtt kézre kerítjük” – nyilatkozta lapunknak."}},

 {id:"v2", at:3300, f:"v2_found", modal:"<h2>Szerda, 07:00 – telefon</h2><p>Bence: „József utca, negyedik emelet. Egy fiatal nő, Vass Kitti, túladagolás.” Szünet. „Keleti doktornő azt mondja, nézd meg személyesen. Nem mondta, miért.”</p>"},
 {id:"nora_hiv", at:4140, req:["nora_help","v2_found"], ev:"kitti_konya", modal:"<h2>Szerda, 21:00 – telefon, Szeged</h2><p>Nóra hangja halk, a háttérben gyerekzsivaj. „Olvastam Kittiről. Együtt kezdtük, Dénes.” Hosszú csend. „2019-ben egy zsaru pénzt adott neki, hogy felismerjen valakit a bíróságon. Kónyának hívták. Kitti azt mondta, egy ártatlan embert küldött börtönbe.” Aztán: „Itt jó. Csend van. Vigyázz magadra.”</p>"},
 {id:"v3", at:4710, f:"v3_found", modal:"<h2>Csütörtök, 06:30 – telefon</h2><p>Varga hangja rekedt. „Kónya Attila. Újpest, a saját garázsában.” Hosszú csend. „Kónya volt a nyomozó a 2019-es Rajna-ügyben, Dénes. Az enyémben.”</p>"},
 {id:"hirlap2", at:4800, front:{h:"Sorozatgyilkos jár a városban?",s:"Bíró, tanú, rendőr: három halott négy nap alatt",b:"Somogyi Kristóf főkapitány-helyettes személyesen vette át a nyomozás koordinálását. „Egy elkövető, egy indíték. Hamarosan letartóztatást jelentünk be” – mondta. Lapunk értesülése szerint az áldozatokat egy rituális jel köti össze."}},
 {id:"apa", at:4920, f:"apa_korhaz", modal:"<h2>Csütörtök, 10:00 – telefon</h2><p>A Platán otthonból hívnak. Apád hajnalban elesett a lépcsőn, combnyaktörés. A Szent János kórházba vitték, holnap műtik. „Magát kérdezte” – mondja a nővér. „Illetve az édesanyját. De magát is.”</p>"},
 {id:"lilimiss", at:4*1440-1440+1320, unless:"lili_bday|lili_bday_reszeg", f:"lili_bday_missed", x:"<b>SMS, Lili:</b> Elfújtam a gyertyákat. Anyának igaza volt."},
 {id:"v4", at:4*1440+1320, unless:"rajna_elfogva|varga_vedve", f:["v4_found","varga_halott"], pat:-20, modal:"<h2>Péntek, 22:40 – telefon</h2><p>Bence sír a telefonban. Először nem érted, mit mond. Aztán érted.</p><p>„Varga. Otthon. Az előszobában.”</p><p>Leteszed a telefont, és sokáig ülsz a sötétben. Varga figyelmeztetett, hogy mindegyik tagad. Te nem figyelmeztetted őt eléggé.</p>"},
 {id:"v4b", at:4*1440+1320, req:["varga_vedve","!rajna_elfogva"], ev:"rajna_menekul", f:"merenylet", modal:"<h2>Péntek, 22:20 – telefon</h2><p>Kata: „Varga kapujában várta. Kalapáccsal. Bodnár észrevette, kiugrott a kocsiból, a fickó elbiciklizett a hóban.” Lihegés. „Varga jól van. Dühös, de él. És megvan az arca a kapukamerán, Dénes. Rajna Ádám.”</p>"},
 {id:"hirlap3", at:5*1440+420, req:["varga_halott"], front:{h:"Megölték a gyilkossági osztály vezetőjét",s:"Varga Ottó alezredes a negyedik áldozat",b:"Somogyi Kristóf főkapitány-helyettes ideiglenesen átvette a gyilkossági osztály irányítását. „Aki ezt tette, nem marad büntetlenül” – mondta, majd elcsukló hangon hozzátette: Varga Ottó a barátja volt."}}
],

locEvents:[
 {id:"somogyi1", loc:"kapitanysag", when:S=>!!S.f.v3_found, f:"halmos_seen", html:"<h2>Somogyi az osztályon</h2><p>A tárgyalóban Somogyi Kristóf áll a tábla előtt, a kezében a te jegyzeteid. Mögötte Halmos Péter, magas, kopasz, a fal mellett, mint egy szekrény.</p><p>„Mátrai. Mostantól személyesen koordinálom. Egy tettes, három áldozat, egy jel.” Visszaadja a jegyzeteidet. „Ne bonyolítsa túl.”</p>"},
 {id:"somogyi2", loc:"kapitanysag", when:S=>!!(S.ev.halmos_konyanal||S.ev.halmos_cella), pat:-15, html:"<h2>„Jöjjön be, Mátrai”</h2><p>Somogyi irodája, csukott ajtó. Nem ül le, és téged sem kínál hellyel.</p><p>„Hallom, Halmos telefonját nézegeti. És a kocsimat.” Megigazítja a mandzsettáját. „Halmos tizenkét évig védte ezt az országot. Maga hat éve iszik. Gondolja, hogy egy bíróság kinek fog hinni?”</p>"},
 {id:"vargaholt", loc:"kapitanysag", when:S=>!!S.f.varga_halott, html:"<h2>Az üres iroda</h2><p>Varga irodájának ajtaján fekete szalag. Az asztalán a whisky a fiókban, ahogy hagyta. Somogyi titkárnője már dobozolja a papírjait.</p><p>Bence nem néz rád. Kata igen, és ez rosszabb.</p>"},
 {id:"dd", loc:"kapitanysag", when:(S,h,A)=>A.inWin(h,[7,19])&&!!S.f.drunkdrive&&!S.f.varga_halott, html:"<h2>„Gyere be egy percre”</h2><p>Varga becsukja az ajtót. „Egy járőr megállított tegnap éjjel. Nem írta fel. Nekem viszont elmondta.” Kiveszi a fiókból a whiskyt, ránéz, visszateszi. „Legközelebb taxival.”</p>"},
 {id:"drunk", loc:"kapitanysag", when:(S,h,A)=>A.inWin(h,[7,19])&&S.alc>55, pat:-10, html:"<h2>Megszagolnak</h2><p>„Délelőtt van, Dénes.” Ennyit mond valaki a folyosón, és továbbmegy. Bence úgy tesz, mintha nem hallotta volna.</p>"}
],

ded:[
 {a:"kocsi_ho", b:"feri_vitt_haza", g:"denes_alibi", f:"bodnar_figyel", t:"A kocsid reggel kétnapos hó alatt állt. Nem vezettél sehova. Bodnár vitt haza, fél tizenkettő után. Akkor ki vitt el éjjel egykor a Szigetre? Senki. Ezt bizonyítani is tudod."},
 {a:"hordo_blokk", b:"kocsi_ho", g:"denes_alibi", f:"bodnar_figyel", t:"23:38-kor még a Hordóban fizettél. A kocsid reggelig nem mozdult. Gyalog nem értél volna a Sziget csúcsára hajnali egyre, ennyi pálinkával biztosan nem."},
 {a:"sal", b:"sal_kocsi", g:"sal_bodnar", f:"bodnar_gyanu", t:"A sálad Bodnár hátsó ülésén maradt. Reggel egy fűzfán lógott, öt méterre a holttesttől. Valaki odaakasztotta."},
 {a:"skoda_kamera", b:"bodnar_skoda", g:"bodnar_szigeten", f:"bodnar_gyanu", t:"Sötétszürke Škoda Octavia. Bodnár két órán át ült melletted a Hordóban, aztán hazavitt. És utána nem ment haza."},
 {a:"skoda_kamera", b:"feri_vitt_haza", g:"bodnar_szigeten", f:"bodnar_gyanu", t:"Feri vitt haza egy sötétszürke Škodával. Negyven perccel később egy sötétszürke Škoda áll be a Sziget parkolójába."},
 {a:"eszter_jegyzet", b:"alapitvany_bodnar", g:"eszter_bodnar", f:"bodnar_gyanu", t:"B.F. Bodnár Ferenc. Huszonöt éve hordja a pénzt. Eszter megtalálta, és éjfélre a Sziget csúcsára hívta, hogy a szemébe mondja. Előtte téged hívott, hogy menj vele. Te részeg voltál."},
 {a:"eszter_jegyzet", b:"penzhordo", g:"eszter_bodnar", f:"bodnar_gyanu", t:"„A rendőr, aki a pénzt hordja. Huszonöt éve.” B.F. Huszonöt éve egyetlen embert ismersz, aki a kerületben mindenkitől pénzt szed."},
 {a:"professzor_latta", b:"bodnar_kerdez", g:"tanu_eltavolitas", t:"Reggel a Professzor azt mondja, látott egy rendőrkabátos embert a jégen. Délután Bodnár már őt keresi. Éjjel a Professzor halott."},
 {a:"diazepam", b:"bodnar_recept", g:"bodnar_diazepam", t:"Diazepam a vérben, pálinkában. Diazepam Bodnár szekrényében, félig üres dobozban."},
 {a:"asp_seb", b:"halott_jegben", g:"asp_bodnar", t:"Teleszkópos bot, egy ütés a halántékra, aztán a jégtörésbe tolta. Nem dühös ember volt. Olyan, aki tudja, hogyan kell ütni, és tudja, hogyan kell eltüntetni."}

docs:{
 boncolas_e:{t:"Boncolási jegyzőkönyv – Gál Eszter", b:"IGAZSÁGÜGYI ORVOSTANI INTÉZET\nVizsgálta: dr. Keleti Mária\n\n[[halalido_e|Halál beállta: 2027. 01. 10., 23:30 és 01. 11., 01:30 között.]]\n[[asp_seb|Halál oka: koponyatörés a bal halántékon. A sérülést hengeres, rugalmas, fémből készült eszköz okozta, legvalószínűbben teleszkópos bot, amilyet a rendőrség is rendszeresít.]]\n[[halott_jegben|A tüdőben víz nincs: már halott volt, amikor a vízbe került.]]\nA jobb kéz körmei alatt gyapjúszálak, sötétkék.\n\n— Kézzel a margón: „Dénes, a gyapjú nem a te sáladé. Megnéztem. Ne nézz így rám. K. M.”"},
 telefon_e:{t:"Hívásrészletező – Gál Eszter", b:"SZOLGÁLTATÓI ADATSZOLGÁLTATÁS, 2027. 01. 10.\n\n18:02  bejövő  Pap Borbála (Hírlap)  6 perc\n21:15  kimenő  Kónya Attiláné  3 perc\n[[utolso_hivas|23:10  kimenő  Mátrai Dénes  2 perc]]\n[[fazekas_hivas|23:40  bejövő  Fazekas Ádám  nem fogadott]]\n[[fazekas_kozel|A hívó fél (Fazekas Á.) cellája 23:40-kor: XIII. ker., a Sziget pesti hídfőjénél.]]\n[[telefon_sziget|A készülék utolsó jelzése: 00:31, a Sziget északi csúcsa. Ezt követően nincs jel.]]\n\nBence megjegyzése: „A 23:10-es hívás… Dénes, te vetted fel. Két percig beszéltetek.”"},
 szigetkamera:{t:"Térfigyelő kamera – a Sziget pesti hídfője", b:"FŐVÁROSI TÉRFIGYELŐ RENDSZER, 1144-es kamera\nIdőszak: 2027. 01. 10. 22:00 – 01. 11. 06:00\n\n[[eszter_kamera|23:52  nő, vörös haj, kék kabát, egyedül, gyalog a hídon a Sziget felé (azonosítva: Gál E.)]]\n[[skoda_kamera|00:20  sötétszürke Škoda Octavia kombi beáll a szigeti parkolóba, a rendszám a hóeséstől nem olvasható. 01:05  kihajt a hídon Pest felé, világítás nélkül.]]\n00:40–00:55  egy alak a híd alatti parton, kabátban, botra támaszkodva, a csúcs felé néz (feltehetőleg hajléktalan)\n05:48  kutyasétáltató a csúcs felé (a holttest megtalálója)\n\nRáczné hadnagy megjegyzése: Bodnár törzszászlós hétfőn azt jelentette, hogy ez a kamera napok óta nem működik. Működik. — R. K."},
 boncolas_k:{t:"Boncolási jegyzőkönyv – Kardos Béla", b:"IGAZSÁGÜGYI ORVOSTANI INTÉZET\nVizsgálta: dr. Keleti Mária\n\n[[halalido_k|Halál beállta: 2027. 01. 11., 23:00 és 01. 12., 02:00 között.]]\nHalál oka: kihűlés.\n[[diazepam|Toxikológia: véralkohol 3,1 ‰, és nagy mennyiségű diazepam. Az elhunyt nem kapott ilyen gyógyszert.]]\n[[kenyszer_ital|Az állkapocs két oldalán friss, ujjnyomnak megfelelő zúzódások: valaki erősen fogta a fejét.]]\n\n— K. M.: „Egy hajléktalan, aki megfagy. Senki nem nézte volna meg. Én megnéztem.”"},
 radio:{t:"Rádióarchívum – vasárnapi élő adás", b:"FŐVÁROS RÁDIÓ – adásnapló\n2027. 01. 10., 23:00–01:00, „Éjszakai beszélgetés”\nVendég: Fazekas Ádám, a Hírlap főszerkesztője\n\n[[fazekas_tisztazva|A vendég az adás teljes ideje alatt a stúdióban tartózkodott, a felvétel folyamatos. 23:38–23:42 reklámszünet. Stúdió: XIII. ker., a Sziget pesti hídfőjénél. Igazolja: két technikus és a műsorvezető.]]\n\nBence megjegyzése: „A stúdió száz méterre van a hídtól. Ezért volt ott a cellája.”"},
 dosszie:{t:"Gál Eszter dossziéja – csomagmegőrző 214", b:"Barna boríték, benne fénymásolatok, jegyzetek, egy pendrive. Eszter apró, sietős kézírása.\n\nA BIZTONSÁGOS VÁROSÉRT ALAPÍTVÁNY – elnök: Somogyi Kristóf\nRendszeres kifizetések, 2019–2026:\n— Kónya Attila, 2020. 12. – 2026. 12., havi 200 000 Ft (megszűnt: elhunyt)\n[[alapitvany_bodnar|— Bodnár Ferenc, 2019. 03. óta, havi 250 000 Ft, „tanácsadói díj”]]\n— „H.P.”, 2020. 11., egyszeri 5 000 000 Ft\n\nForrás: Kónya Attiláné, aki a férje halála után mindent átadott.\n\nUtolsó oldal:\n[[eszter_jegyzet|„Vasárnap éjfél, Sziget csúcsa, B.F. Előtte felhívom Dénest. Ha nem jön, akkor is. Szembe akarom nézni vele, mielőtt megírom.”]]\n\nAlatta, kisebb betűkkel: „Dénes nem tudja. Huszonöt éve dolgozik vele.”"},
 bot:{t:"Laborjelentés – Bodnár F. szolgálati botja", b:"BŰNÜGYI TECHNIKAI LABOR\nVizsgálta: Halász Tamás\nElrendelte: dr. Szép Viktória, belső ellenőrzés\n\nMinta: ESP teleszkópos bot, 21”, nyilvántartási szám: 0447, használó: Bodnár Ferenc törzszászlós.\n\nA bot felülete alaposan megtisztítva.\n[[bot_ver|A második és harmadik tag illesztésében beszáradt vér. DNS-profil: Gál Eszter.]]\n\n— H. T.: „Huszonöt évig dolgoztam vele, Dénes. Mindig hozott pogácsát karácsonykor.”"},
 skoda:{t:"Átvizsgálás – Bodnár F. gépkocsija", b:"JEGYZŐKÖNYV, járműátvizsgálás\nJármű: sötétszürke Škoda Octavia kombi, üzembentartó: Bodnár Ferenc\nElrendelte: dr. Szép Viktória, belső ellenőrzés. Jelen volt: Rácz K. hadnagy\n\nA belső tér frissen porszívózva.\n[[csomagtarto|A csomagtartó szőnyege alatt hosszú, vörösre festett hajszálak és egy sötétkék gyapjúszál (vizsgálat alatt: Gál E. kabátja).]]\nA hátsó ülés alatt egy pár vastag munkáskesztyű, rajtuk jég és homok."},
 profil3:{t:"Pszichológiai profil – dr. Fehér Judit", b:"ELŐZETES TETTESPROFIL – Gál Eszter\n\nA tettes ismeri a rendőri munkát. Tudja, hogyan kell ütni, hogyan kell eltüntetni, és tudja, mit fog keresni a nyomozó.\n\nNem tervezett gyilkos. Pánikból ölt, de utána nagyon hidegen rendezett. A sál a fán nem véletlen: a tettes ismer téged, főhadnagy. Ismeri a gyengeségeidet, az ivást, a kieső éjszakáidat. Arra számított, hogy magadnak sem fogsz hinni.\n\nAz ilyen ember közel van. Ott ül melletted, és segít.\n\n— Mátrai főhadnagy: kérem, ne igyon most. Most különösen ne. F. J."}
},

people:{
 varga:{n:"Varga Ottó alezredes", r:"osztályvezető", loc:"kapitanysag", h:[7,19], gone:"varga_halott", bio:"56 éves. December óta többet iszik, és kevesebbet beszél. Most nem néz a szemedbe, és ez rosszabb bármilyen kérdésnél.", topics:[
  {id:"hol", l:"Varga kérdez", t:"„Hol voltál vasárnap éjjel, Dénes?” Nem tudod. Ezt mondod. Lehunyja a szemét. „A belső ellenőrzés már itt van. Dr. Szép Viktória. Ne hazudj neki. És ne igyál.” Az ajtóban megáll. „Hiszek neked. Csak bizonyítsd be, hogy igazam van.”", f:"briefed"},
  {id:"statusz", l:"Jelentés az ügyről", rep:1, dyn:"vargaStatus"}
 ]},
 somogyi:{n:"Somogyi Kristóf", r:"főkapitány", loc:"kapitanysag", h:[8,18], suspect:1, bio:"45 éves, fotogén, politikai kapcsolatokkal. Gál Eszter fél éve írt róla, és most Eszter halott. Somogyi ma reggel sajtótájékoztatót tartott, ahol a te nevedet nem mondta ki, de mindenki értette.", topics:[
  {id:"beszel", l:"Beszélsz vele", t:"„Mátrai. Megkérdezném, hol volt vasárnap éjjel, de úgy hallom, maga sem tudja.” Mosolyog. „Egy részeg nyomozó, egy halott újságíró, aki utoljára őt hívta, és az ő sála egy fán. Ha nem maga lenne, már bent ülne.”", f:"met_somogyi"},
  {id:"eszter", l:"Gál Eszterről", t:"„Az a nő mindenkiről írt. Rólam is, hamisan.” Megigazítja a nyakkendőjét. „Sajnálom, ami történt. Őszintén. De nem fogok úgy tenni, mintha hiányozna.”", ev:"somogyi_inditek"},
  {id:"vasarnap", l:"Hol volt vasárnap éjjel?", sober:1, t:"„Fél tizenegyig élő adásban, utána haza, a sofőröm vitt. A feleségem aludt.” Rád néz. „Kérdezze meg a sofőrömet. Ő mindig ott van, ahol én.”", ev:"somogyi_alibi"},
  {id:"bodnar", l:"Bodnárról kérdezed", req:["alapitvany_bodnar"], sober:1, t:"Egy pillanatra elhallgat. Csak egy pillanatra. „Az alapítvány tanácsadókat fizet. Bodnár törzszászlós huszonöt éve ismeri a kerületet. Ez nem bűn.” Feláll. „Vigyázzon, Mátrai. Aki a kezét nyújtja, az még nem a barátja.”", f:"somogyi_tud"}
 ]},
 szep:{n:"Dr. Szép Viktória", r:"belső ellenőr", loc:"kapitanysag", h:[8,18], bio:"44 éves, a belső ellenőrzés vizsgálója. Halk hang, pontos kérdések, és egy jegyzetfüzet, amibe mindent leír. Nem gyűlöl téged. Csak nem hisz neked.", topics:[
  {id:"meghallgatas", l:"A meghallgatás", t:"„Három dolgot tudok, főhadnagy. Gál Eszter utoljára magát hívta. A sála a holttest mellett volt. És maga nem emlékszik semmire.” Felnéz. „Csütörtök reggel nyolcig adok időt, hogy mást is tudjak. Utána őrizetbe veszem.”", f:"ia_hivas"},
  {id:"alibi", l:"Bemutatod, hogy nem vezettél sehova", req:["denes_alibi"], t:"Hosszan olvassa a jegyzeteidet. Felhívja Lacit, aztán a szomszédodat. Becsukja a füzetét. „Rendben, főhadnagy. Egyelőre nem maga a gyanúsítottam.” Szünet. „De akkor ki akasztotta a sálját a fára?”", f:"denes_tisztazva"},
  {id:"bodnar", l:"Bodnárról beszélsz neki", req:["denes_tisztazva","bodnar_gyanu"], t:"Nem szakít félbe. Amikor végzel, sokáig hallgat. „Egy kolléga ellen bizonyíték kell, nem érzés. Ha a botját vagy a kocsiját akarja, én írom alá az engedélyt.” Feláll. „Huszonöt év, Mátrai. Ha téved, ő soha nem bocsát meg magának. És én sem.”", f:"ia_szovetseges"}
 ]},
 bence:{n:"Tóth Bence", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"29 éves, lelkes, jó a rendszerekben. Ma reggel nem hozott kávét. Aztán mégis hozott, és szó nélkül letette eléd.", topics:[{id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintBence"}]},
 kata:{n:"Rácz Kata", r:"nyomozó", loc:"kapitanysag", h:[7,21], staff:1, bio:"36 éves, az osztály legélesebb esze. Rácz Gábor lánya.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintKata"},
  {id:"hisz", l:"Hiszel nekem?", dyn:"kataHisz"}
 ]},
 bodnar:{n:"Bodnár Feri", r:"törzszászlós", loc:"kapitanysag", h:[7,21], staff:1, gone:"bodnar_vad", bio:"58 éves, huszonöt éve jár utcára. Vasárnap éjjel ő vitt haza a Hordóból. Ma reggel ő hozta el a kocsidat a hó alól, mielőtt megkérted volna.", topics:[
  {id:"gond", l:"Mit gondolsz?", rep:1, dyn:"hintBodnar"},
  {id:"vasarnap", l:"Vasárnap éjjel hazavittél?", t:"„Haza, persze. Alig álltál a lábadon, Dénes. Felkísértelek a lépcsőn, aztán én is hazamentem.” Megpaskolja a vállad. „Semmire nem emlékszel, ugye? Nem baj. Majd én emlékszem helyetted.”", f:"bodnar_vasarnap"},
  {id:"sal", l:"Szembesít: a sál", req:["sal_bodnar"], sober:1, t:"„A sálad? Biztos kiesett, amikor kiszálltál.” Mosolyog. Nem néz a szemedbe. Huszonöt éve ismered, és most először nem tudod, mit lát a szeme mögött."},
  {id:"kamera", l:"Szembesít: a kamera", req:["sab_kamera","doc:szigetkamera"], sober:1, t:"„Elnéztem, Dénes. Öreg vagyok, rossz a szemem.” A keze a zsebében, a kabátja alatt. Ott, ahol a botját hordja."},
  {id:"penz", l:"Szembesít: az alapítvány", req:["alapitvany_bodnar"], sober:1, t:"Sokáig hallgat. Aztán leül, nehezen, mint egy öregember. „Huszonöt év, Dénes. Huszonöt év fagyban, szarban, hullák között. Tudod, mennyi lesz a nyugdíjam?” Felnéz. „Kónya is elvette. Mindenki elvette. Csak te nem, mert te inni szoktál helyette.”"}
 ]},
 halasz:{n:"Halász Tamás", r:"nyomszakértő", loc:"kapitanysag", h:[8,22], staff:1, bio:"41 éves, pedáns. A laborban most csend van: kikapcsolta az Omegát, amikor meghallotta, kit találtak a jégben.", topics:[{id:"gond", l:"Mi van a laborban?", rep:1, dyn:"hintHalasz"}]},
 feher:{n:"Dr. Fehér Judit", r:"pszichológus, profilozó", loc:"kapitanysag", h:[9,17], staff:1, bio:"52 éves. Ő az egyetlen az épületben, aki ma megkérdezte, hogy vagy.", topics:[
  {id:"blackout", l:"A kiesett éjszakáról", t:"„A blackout nem bűntudat, főhadnagy. Az agy egyszerűen nem írja fel, amit az alkohol alatt átél.” Leveszi a szemüvegét. „Ez azt jelenti, hogy amit nem tud, azt mástól kell megtudnia. Ne higgye el elsőre, amit a félelme mond.”"},
  {id:"recept", l:"Bodnár gyógyszereiről kérdezed", req:["bodnar_gyanu","loy:feher:60"], t:"Sokáig hallgat. „Ez orvosi titok.” Aztán mégis: „Bodnár törzszászlós három éve szed diazepamot. Én írattam fel neki, alvászavarra. Azt mondta, a halottak nem hagyják aludni.” Rád néz. „Ezt nem tőlem tudja.”", ev:"bodnar_recept"},
  {id:"recept_low", l:"Bodnár gyógyszereiről kérdezed", req:["bodnar_gyanu","!loy:feher:60","!bodnar_recept"], rep:1, t:"„Orvosi titok, főhadnagy.” Nem enged. <i>(Fehér lojalitása nem elég. Esetleg a szekrényben is körülnézhetsz.)</i>"}
 ]},
 keleti:{n:"Dr. Keleti Mária", r:"igazságügyi orvosszakértő", loc:"intezet", h:[7,19], staff:1, bio:"61 éves, cinikus, láncdohányos. Apád barátja. Ma nem gyújtott rá, amikor beléptél, és ebből tudod, hogy aggódik.", topics:[
  {id:"elozetes", l:"Előzetes vélemény", req:["body1"], t:"„Egy ütés a halántékra, Dénes. Nem kéz, nem kő. Valami hengeres, ruganyos. Láttam már ilyet, sokszor.” Rád néz. „A tiéd a szekrényben van?” Bólintasz. „Akkor hozd be, mielőtt más kéri.”"},
  {id:"apa", l:"Apámról", t:"„Tegnap voltam nála. Már nem nagyon eszik. Az orvos szerint napok kérdése.” Nem néz rád. „Délelőtt menj, Dénes. Most ne halaszd.”"}
 ]},
 apa:{n:"Mátrai Gyula", r:"az apád", loc:"platan", h:[9,19], gone:"apa_halal", bio:"74 éves. Már nem eszik rendesen, és egyre többet alszik. Délelőttönként, egy-egy órára, még ő a régi.", topics:[
  {id:"bodnar", l:"Bodnárról kérdezed", req:["bodnar_gyanu|bodnar_vasarnap"], lucid:[9,11], t:"Sokáig nézi a kezed. „A Bodnár gyerek. Feri.” Behunyja a szemét. „1994-ben ő hozta be Vámos Lajos alibijét. Egy szomszédasszonyt, aki látta Lajost otthon. Hazudott az asszony, tudtam. Feri pénzt kapott érte. És én hallgattam, mert jó zsaru volt, és fiatal, és azt hittem, majd kinövi.” A szeme nedves. „Nem nőtte ki, ugye?”", ev:"apa_bodnar", f:"apa_bodnar_t"},
  {id:"bucsu", l:"Megfogod a kezét", lucid:[9,11], eff:{crave:-25}, t:"Most tudja, ki vagy. „Dénes.” A keze könnyű, mint a papír. „Hagyd abba, fiam. Az ivást. Én sem tudtam abbahagyni a hallgatást. Mindkettő ugyanaz.” Megszorítja a kezed, gyengén. „A kicsi szép lány lett. Mondd meg neki.”", f:"apa_bucsu"},
  {id:"beszel", l:"Csak leülsz mellé", rep:1, dyn:"apaTalk"}
 ]},
 lili:{n:"Mátrai Lili", r:"a lányod", loc:"zeneakademia", h:[16,19], bio:"17 éves. Felvették egy bécsi nyári mesterkurzusra, és ehhez mindkét szülő aláírása kell. Látta az újságot.", topics:[
  {id:"ujsag", l:"Láttad az újságot?", dyn:"liliUjsag"},
  {id:"alairas", l:"Aláírod az űrlapot", req:["met_lili"], dyn:"liliAlairas"}
 ]},
 lili2:{n:"Mátrai Lili", r:"a lányod", loc:"temeto", h:[10,13], vis:"apa_halal", bio:"Fekete kabátban, az anyja mellett. Amikor meglát, elengedi az anyja kezét.", topics:[
  {id:"temetes", l:"Odaállsz mellé", dyn:"liliTemetes", f:"apa_temetes"}
 ]},
 nora:{n:"Nóra", r:"régi ismerős", loc:"nora", h:[20,4], gone:"nora_help", bio:"31 éves, még mindig a VIII. kerületben, még mindig Gazsi alatt. Egy idő óta nem kérdez semmit, csak teát főz.", topics:[
  {id:"ora", l:"Maradsz nála egy órát (8 000 Ft)", rep:1, cost:8000, mins:60, eff:{crave:-25}, dyn:"noraTalk"},
  {id:"bodnar", l:"Bodnárról kérdezed", t:"Lerakja a bögrét. „Feri? Húsz éve szedi a pénzt a lányoktól és a gépektől. Védelmi díj, így hívja. Gazsi fizet neki, mindenki fizet neki.” Rád néz. „Te tényleg nem tudtad, Dénes?”", ev:"nora_bodnar"},
  {id:"professzor", l:"A Professzorról kérdezed", req:["v2_found"], t:"„Az öreg tanár? Hétfő délután Feri a híd alatt kérdezősködött utána. Hogy hol alszik, kivel iszik.” Megborzong. „Azt hittem, segíteni akar neki.”", ev:"bodnar_kerdez"}
 ]},
 fazekas:{n:"Fazekas Ádám", r:"a Hírlap főszerkesztője", loc:"hirlap", h:[9,22], suspect:1, bio:"55 éves, ősz szakáll, drága sál. Térdműtét óta sétabottal jár. Huszonöt éve ismerte Esztert, és tavaly ősszel letiltotta a legfontosabb cikkét.", topics:[
  {id:"eszter", l:"Eszterről", t:"„A legjobb újságíróm volt. A legnehezebb is.” Leül, a botját az asztalnak támasztja. „Letiltottam a Somogyi-cikkét. Nyomás volt, a tulajdonos. Felmondott, és azt mondta, a konkurenciánál mindent megír. Rólam is.” Nem néz fel. „Igaza lett volna.”", ev:"fazekas_vita", f:"met_fazekas"},
  {id:"vasarnap", l:"Hol volt vasárnap éjjel?", t:"„Otthon.” Túl gyorsan mondja. Aztán: „Illetve…” Nem fejezi be."},
  {id:"hivas", l:"Szembesít: a 23:40-es hívás", req:["fazekas_hivas|fazekas_kozel"], sober:1, t:"Elsápad. „Rádióban voltam. Élő adás, éjszakai beszélgetés, a Sziget melletti stúdióban. A reklámszünetben hívtam fel. Bocsánatot akartam kérni.” A hangja megremeg. „Nem vette fel. Azt hittem, haragszik.”", f:"fazekas_radio"},
  {id:"bori", l:"Kivel beszélt Eszter utoljára?", t:"„Pap Borival, a gyakornokkal. Szerdán. Kérdezze meg őt.”"}
 ]},
 bori:{n:"Pap Borbála", r:"gyakornok", loc:"hirlap", h:[9,22], bio:"24 éves, a Hírlap gyakornoka. Eszter tanítványa volt, és most úgy ül az asztala mellett, mintha őrizné.", topics:[
  {id:"szerda", l:"Mit mondott Eszter szerdán?", sober:1, t:"„Azt mondta: »Bori, megvan a rendőr, aki a pénzt hordja. Huszonöt éve csinálja, és mindenki szereti.«” Megtörli a szemét. „Nevetett. Azt mondta, ez lesz élete cikke.”", ev:"penzhordo"},
  {id:"asztal", l:"Ki ürítette ki az asztalát?", t:"„Vasárnap este, nyolc körül, egy rendőr. A portás azt mondta, igazolványt mutatott. Idősebb, bajszos, barátságos. Pogácsát hozott a portásnak.”", f:"pogacsa"}
 ]},
 marta:{n:"Kiss Márta", r:"szociális munkás", loc:"szallo", h:[7,22], bio:"48 éves, húsz éve dolgozik hajléktalanokkal. Mindenkit a nevén szólít, és nem hiszi el, hogy a Professzor magától fagyott meg.", topics:[
  {id:"professzor", l:"A Professzorról", req:["v2_found"], sober:1, t:"„Hétfő reggel azt mondta, látott valamit vasárnap éjjel a Sziget csúcsánál. Egy rendőrkabátos embert, aki valamit a jégre húzott.” Összefonja a karját. „Azt mondta, csak a rendes rendőröknek mondja el. Az öreg Mátrai fiának.” Elmosolyodik. „Ismerte magát, főhadnagy. Latinra tanította a gimnáziumban. Azt mondta, maga volt a legrosszabb tanítványa.”", ev:"professzor_latta"},
  {id:"hetfo", l:"Ki járt itt hétfő éjjel?", req:["v2_found"], sober:1, t:"„Egy rendőr. A Feri, bajuszos, barátságos, mindenki ismeri. Pálinkát hozott a Professzornak, drágát. Kint ittak a híd alatt.” Elhallgat. „Reggel a Professzor ott feküdt a párkányon.”", ev:"rendor_szallon"},
  {id:"szekreny", l:"Megnézheted a Professzor szekrényét?", req:["v2_found"], t:"Hosszan néz. „Az apjára hasonlít.” Előveszi a kulcscsomót. „A harmincegyes. Hétfőn reggel valamit nagyon gondosan elzárt benne.”", f:"szekreny_ok"}
 ]},
 bajusz:{n:"Tóth „Bajusz” Lajos", r:"a Professzor szomszédja", loc:"szallo", h:[12,22], vis:"v2_found", suspect:1, bio:"61 éves, egykori hajóskovács, vastag bajusz, remegő kéz. A Professzor kabátjában ül, ami két számmal nagyobb rá.", topics:[
  {id:"kabat", l:"A kabátról", t:"„Neki már nem kell, nekem igen.” Megtapogatja a zsebét. „A pénzt is elvettem, nyolcezret. Ítéljen el.”", ev:"bajusz_lopas", f:"met_bajusz"},
  {id:"hetfo", l:"Hol volt hétfő éjjel?", t:"„Itt, a szomszéd ágyon. Vagy nem.” Vakarja a fejét. „Nem emlékszem. Néha nem emlékszem.”", ev:"bajusz_szallas"},
  {id:"zseb", l:"Megnézed a zsebeit", t:"Egy levél diazepam, a csomagolásán a kórházi patika címkéje. „A detoxon adták.” Kikapja a kezedből. „Az enyém.”", ev:"bajusz_diazepam"}
 ]},
 laci:{n:"Laci", r:"kocsmáros", loc:"hordo", h:[15,3], bio:"A Hordó kocsmárosa. Ma először nem tölt, amikor belépsz.", topics:[
  {id:"vasarnap", l:"Mi történt vasárnap?", t:"„Itt ittál fél tizenkettőig. Tizenegy után valaki hívott, kimentél, visszajöttél, és azt mondtad: holnap.” Törölgeti a poharat. „Aztán Feri vitt haza. Alig álltál. Ő fizette ki a számlád felét.”", ev:"feri_vitt_haza"},
  {id:"feri", l:"Bodnár vasárnap", req:["feri_vitt_haza"], t:"„Feri? Egész este melletted ült. Te ittál, ő nem. Kólát ivott.” Leteszi a poharat. „Huszonöt év alatt egyszer nem láttam Ferit kólát inni.”"},
  {id:"professzor", l:"A Professzorról", req:["v2_found"], t:"„Az öreg tanár? Hétfőn délután Feri a híd alatt kérdezősködött utána. Valaki mesélte.”", ev:"bodnar_kerdez"}
 ]},
 bokszos:{n:"Szikszai „Bokszos” Imre", r:"gyerekkori barát", loc:"hordo", h:[19,2], bio:"47 éves, volt bokszoló, ma éjszakai portás. Ma nem iszik, csak ül, és figyeli, te mennyit iszol.", topics:[
  {id:"sal", l:"Emlékszel vasárnapra?", t:"„Ott voltam, amikor Feri beültetett a kocsijába. Hátra, mert nem bírtál ülni.” Megdörzsöli az orrát. „A sálad a hátsó ülésen maradt. Kiabáltam utánad, de te már a lépcsőházban énekeltél.”", ev:"sal_kocsi"},
  {id:"regi", l:"Csak iszol vele egyet (900 Ft)", rep:1, drink:1, dyn:"bokszosTalk"}
 ]}
},

{
const $=s=>document.querySelector(s);
const KEY='revesz_save_v2', META='redemption_meta_v1';
const DAYN=['hétfő','kedd','szerda','csütörtök','péntek','szombat','vasárnap'];
const MON=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
const STAFF=['bence','kata','bodnar','halasz','keleti','feher'];
const CAT={I:'Indíték',A:'Alkalom',M:'Módszer'};
const PERSIST=['nora_help','koncert','koncert_reszeg','lili_missed','apa_revesz','apa_1994','berkes_beismeres','leak','lili_bday','lili_bday_reszeg','lili_bday_missed','kata_titok','apa_korhaz','varga_halott','halmos_vad','rajna_elfogva','merenylet','lili_ajandek','apa_latogatas','apa_racz','lili_alairas','apa_halal','apa_temetes','apa_bucsu','bodnar_vad','somogyi_bukik','denes_tisztazva'];
let CASE,P,L,E,ORDER,VICT,SOL,S=null;
function setCase(id){
  CASE=CASES[id];P=CASE.people;L=CASE.locs;E=CASE.ev;ORDER=CASE.order||Object.keys(CASE.suspects);
  VICT=CASE.victims||[{id:'main',n:'Halmi Zsófia'}];SOL=CASE.solution||{main:CASE.culprit};
}
const CASE_IDS=Object.keys(CASES);

// ---------- állapot ----------
function meta(){try{return JSON.parse(localStorage.getItem(META))||{done:{},persist:null}}catch(e){return{done:{},persist:null}}}
function saveMeta(m){try{localStorage.setItem(META,JSON.stringify(m))}catch(e){}}
function fresh(cid){
  setCase(cid);const m=meta(),ps=m.persist;
  const s={case:cid,t:CASE.start.t,loc:CASE.start.loc,fat:35,alc:18,crave:30,money:ps?Math.max(ps.money,8000):14600,bottle:3,pat:100,
    ev:{},f:{},docs:{},done:{},hs:{},tr:{},staff:{},loy:{},pending:[],board:{},verd:{},rejects:0,ended:null,log:[],fired:{},notes:[],
    view:'loc',tab:null,doc:null,sel:[],day:0,visited:{},prev:m.done||{}};
  STAFF.forEach(id=>{s.staff[id]={busy:0,load:0};s.loy[id]=ps&&ps.loy&&ps.loy[id]!=null?ps.loy[id]:60});
  if(ps&&ps.f)PERSIST.forEach(k=>{if(ps.f[k])s.f[k]=1});
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function has(k){
  if(k.startsWith('doc:'))return!!S.docs[k.slice(4)];
  if(k.startsWith('loy:')){const[,id,v]=k.split(':');return S.loy[id]>=+v}
  if(k.startsWith('!'))return!has(k.slice(1));
  return!!(S.ev[k]||S.f[k]);
}
const reqOk=r=>!r||r.every(g=>g.split('|').some(has));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- idő ----------
const hourOf=t=>Math.floor((t%1440)/60);
const clock=t=>String(hourOf(t)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function dayLabel(t){const d=Math.floor(t/1440),c=CASE.date||[2026,10,23],dt=new Date(c[0],c[1],c[2]+d);return `${d+1}. nap · ${DAYN[d%7]}, ${MON[dt.getMonth()]} ${dt.getDate()}.`}
const inWin=(h,w)=>!w||(w[0]<w[1]?h>=w[0]&&h<w[1]:h>=w[0]||h<w[1]);
const mult=()=>(S.fat>85?1.4:1)*(S.crave>70?1.25:1);
const clamp=v=>Math.max(0,Math.min(100,v));
const dayIdx=()=>Math.floor(S.t/1440);
function advance(m,sleepRate){
  m=Math.round(m);
  while(m>0&&!S.ended){
    const dt=Math.min(10,m);m-=dt;S.t+=dt;
    if(sleepRate)S.fat=clamp(S.fat-sleepRate*dt);else S.fat=clamp(S.fat+4.5/60*dt);
    S.alc=clamp(S.alc-7/60*dt);
    S.crave=clamp(S.crave+(S.alc<15?3.5:-5)/60*dt);
    const d=Math.floor((S.t-360)/1440);
    if(d>S.day){S.day=d;STAFF.forEach(id=>S.staff[id].load=0)}
    checkPending();checkTimed();
  }
  if(S.skip&&!S.ended){const k=S.skip;S.skip=0;advance(k,.12)}
  if(!sleepRate&&S.fat>=100&&!S.ended)collapse();
}
function act(m){advance(m*mult())}
function collapse(){
  advance(360,0.1);S.fat=45;
  queue('<h2>Elsötétül minden</h2><p>Egyszer csak a padlót látod, közelről. Valaki a nevedet mondja, aztán már nem.</p><p>Hat órával később térsz magadhoz, ugyanott, zsibbadt karral és üres zsebbel a fejedben.</p>');
}

// ---------- napló, értesítés ----------
function note(txt,kind){
  S.log.unshift({t:S.t,x:txt});
  const box=$('#toasts');while(box.children.length>3)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.innerHTML=txt;
  box.appendChild(el);setTimeout(()=>el.classList.add('out'),4200);setTimeout(()=>el.remove(),4800);
}
function addEv(id){if(!E[id]||S.ev[id])return;S.ev[id]=S.t;note('Új bizonyíték: <b>'+E[id].n+'</b>','ev')}
function addDoc(id){if(S.docs[id])return;S.docs[id]={n:1};note('Új akta: <b>'+CASE.docs[id].t+'</b>','doc')}
function setF(k){if(!S.f[k])S.f[k]=S.t||1}
let Q=[];
function queue(html,btns){Q.push([html,btns]);if($('#modal').hidden)nextModal()}
function nextModal(){const x=Q.shift();if(x)modal(x[0],x[1]||[['Tovább','close']])}
function front(f){
  queue(`<div class="paperfront"><div class="mast">Hírlap<span>${dayLabel(S.t).split(' · ')[1]}</span></div><h2>${f.h}</h2>${f.s?`<p class="deck">${f.s}</p>`:''}<p>${f.b||''}</p></div>`,[['Leteszed az újságot','close']]);
}

// ---------- stáb ----------
function staffState(id){
  const st=S.staff[id],p=P[id];
  if(p.gone&&reqOk([p.gone]))return{k:'off',x:'Nincs többé a stábban'};
  if(st.busy>S.t)return{k:'busy',x:'Dolgozik · kész '+clock(st.busy)};
  if(!inWin(hourOf(S.t),p.h))return{k:'off',x:`Nincs bent (${p.h[0]}–${p.h[1]} óra)`};
  return{k:'free',x:'Szabad'};
}
function taskAvail(tk){
  if(S.done['task:'+tk.id]||S.pending.some(p=>p.task===tk.id))return false;
  if(!reqOk(tk.req))return false;
  if(tk.minEv&&Object.keys(S.ev).length<tk.minEv)return false;
  return true;
}
function chance(tk,sid){const st=S.staff[sid];return Math.max(.15,Math.min(.98,(tk.fit[sid]||0)+(S.loy[sid]-60)/250-Math.max(0,st.load-1)*.08))}
function dispatch(tid,sid){
  const tk=CASE.tasks.find(x=>x.id===tid);if(!tk||!taskAvail(tk))return;
  if(staffState(sid).k!=='free')return;
  const st=S.staff[sid];
  const sab=!!(tk.sab&&tk.sab[sid]);
  const ok=!sab&&Math.random()<chance(tk,sid);
  if(S.loc!=='kapitanysag')act(5);
  if(st.load>=2){S.loy[sid]=clamp(S.loy[sid]-6);note(`${P[sid].n} szó nélkül indul. Ma ez már a harmadik feladata.`,'bad')}
  st.load++;st.busy=S.t+tk.dur;
  S.pending.push({task:tid,staff:sid,at:S.t+tk.dur,ok,sab});
  note(`${P[sid].n} elindult: ${tk.l.toLowerCase()}. Kész kb. ${clock(S.t+tk.dur)}.`);
  if(tk.warn){S.pat-=5;queue(tk.warn)}
  checkPat();render();
}
function checkPending(){
  for(const p of S.pending.slice()){
    if(S.t<p.at)continue;
    S.pending.splice(S.pending.indexOf(p),1);
    const tk=CASE.tasks.find(x=>x.id===p.task),who=P[p.staff].n;
    if(p.ok){S.done['task:'+tk.id]=1;S.loy[p.staff]=clamp(S.loy[p.staff]+2);if(tk.doc)addDoc(tk.doc);if(tk.f)setF(tk.f);if(tk.ev)addEv(tk.ev);note(who+': '+tk.ok,'doc')}
    else if(p.sab){setF('sab_'+tk.id);note(who+': '+tk.sab[p.staff],'bad')}
    else{S.loy[p.staff]=clamp(S.loy[p.staff]-2);note(who+': '+(tk.fail||'Nem sikerült. Próbáld újra, vagy küldj mást.'),'bad')}
  }
}
function checkTimed(){
  for(const x of CASE.timed||[]){
    if(S.fired['tm:'+x.id]||S.t<x.at)continue;
    if(x.req&&!reqOk(x.req)){if(!x.wait)S.fired['tm:'+x.id]=1;continue}
    S.fired['tm:'+x.id]=1;
    if(x.unless&&reqOk([x.unless])){if(x.alt)fireT(x.alt);continue}
    fireT(x);
  }
}
function fireT(x){
  if(x.f)[].concat(x.f).forEach(setF);if(x.money)S.money+=x.money;if(x.pat)S.pat+=x.pat;
  if(x.ev)[].concat(x.ev).forEach(addEv);if(x.doc)addDoc(x.doc);
  if(x.x)note(typeof x.x==='function'?x.x(S):x.x,'msg');
  if(x.front)front(typeof x.front==='function'?x.front(S):x.front);
  if(x.modal)queue(typeof x.modal==='function'?x.modal(S):x.modal);
  if(x.go){S.loc=x.go;S.view='loc';S.tab=null}
  if(x.skip)S.skip=(S.skip||0)+x.skip;
  checkPat();
}
function isClosed(l,h){return(l.open&&!inWin(h,l.open))||(l.day!==undefined&&dayIdx()!==l.day)}
const visible=o=>(!o.vis||reqOk([o.vis]))&&(!o.gone||!reqOk([o.gone]));

// ---------- utazás ----------
function travelMin(a,b){
  const A=L[a],B=L[b],d=Math.hypot(A.x-B.x,A.y-B.y);
  return Math.round(7+d/11+(A.side!==B.side?6:0));
}
function go(id,mode){
  if(id===S.loc||S.ended)return;
  if(S.alc>45&&!mode){
    modal(`<h2>Volán mögé ülsz?</h2><p>A szádban még ott az íze. A kezed nem egészen a tiéd.</p>`,[[`Taxi (2 500 Ft)`,'travel:'+id+':taxi',S.money<2500],['Vezetsz','travel:'+id+':drive'],['Maradsz','close']]);
    return;
  }
  if(mode==='taxi')S.money-=2500;
  act(travelMin(S.loc,id));
  if(mode==='drive'&&Math.random()<.22){
    setF('drunkdrive');S.pat-=15;
    queue('<h2>Kék villogó a visszapillantóban</h2><p>Egy fiatal járőr hajol az ablakhoz, aztán megismer. Hosszan néz, és elenged. Holnapra a főnököd tudni fogja.</p>');
  }
  if(!S.ended){S.loc=id;S.view='loc';S.visited[id]=1;locEvents()}
  checkPat();render();
}
const API={addEv:id=>addEv(id),addDoc:id=>addDoc(id),has:k=>has(k),hourOf,inWin,clamp,setF:k=>setF(k),leads:()=>leads(),n:()=>Object.keys(S.ev).length,P:()=>P};
function locEvents(){
  const h=hourOf(S.t);
  for(const x of CASE.locEvents||[]){
    if(S.fired['le:'+x.id]||(x.loc&&x.loc!==S.loc))continue;
    if(x.when&&!x.when(S,h,API))continue;
    S.fired['le:'+x.id]=1;if(x.pat)S.pat+=x.pat;if(x.f)setF(x.f);if(x.ev)addEv(x.ev);if(x.doc)addDoc(x.doc);
    queue(typeof x.html==='function'?x.html(S,API):x.html);
  }
}

  const r={
    sleepHome:()=>{advance(420,.24);if(S.fat<5)S.fat=5;note('Hét óra alvás. Álmodban a folyó mellett állsz, és valaki a nevedet kiabálja a túlpartról.')},
    sleepSofa:()=>{advance(240,.2);note('Négy óra a kanapén. A neoncső zümmögését álmodban is hallod.')},
    sleepCar:()=>{advance(180,.19);note('Három óra a kocsiban. Bemerevedett nyakkal ébredsz.')},
    coffee:()=>{act(10);S.fat=clamp(S.fat-12);note('Automatás kávé. Rossz, de forró.')},
    bottle:()=>{if(S.bottle<1)return;S.bottle--;S.drinks=(S.drinks||0)+1;act(10);S.alc=clamp(S.alc+18);S.crave=clamp(S.crave-30);note('Egy kupica a hűtőből. Aztán még egy fél.')},
    bar:()=>{if(S.money<900)return;S.money-=900;S.drinks=(S.drinks||0)+1;act(40);S.alc=clamp(S.alc+20);S.crave=clamp(S.crave-35);note('Laci kérdés nélkül tölt.')},
    buy:()=>{if(S.money<3500)return;S.money-=3500;S.bottle+=3;act(5);note('Egy üveg körtét viszel haza.')}
  }[a]||(CASE.actions&&CASE.actions[a]&&(()=>{const x=CASE.actions[a];if(x.cost&&S.money<x.cost)return;if(x.cost)S.money-=x.cost;act(x.mins||20);if(x.f)setF(x.f);if(x.ev)addEv(x.ev);note(x.x)}));
  if(r){r();checkPat();render()}
}
function inspect(id){
  const h=L[S.loc].hs.find(x=>x.id===id);if(!h||S.hs[S.loc+':'+id])return;
  act(12);S.hs[S.loc+':'+id]=1;
  [].concat(h.ev||[]).forEach(addEv);if(h.f)setF(h.f);if(h.doc)addDoc(h.doc);
  S.notes.unshift({t:S.t,loc:L[S.loc].n,l:h.l,x:h.t});
  S.lastHs={id,t:h.t};render();
}
function talk(pid){S.view='talk:'+pid;setF('met_'+pid);render()}
function staffDrinkTopic(pid){
  if(!STAFF.includes(pid))return null;
  return{id:'ital',l:'Meghívod egy italra (1 800 Ft)',drinkStaff:1};
}
function topicsOf(pid){const p=P[pid],t=p.topics.slice();const d=staffDrinkTopic(pid);if(d&&hourOf(S.t)>=16&&!S.f['ital_'+pid+'_'+dayIdx()])t.push(d);return t}
function topic(pid,tid){
  const p=P[pid],tp=topicsOf(pid).find(x=>x.id===tid),key=pid+':'+tid;
  if(!tp||(S.done[key]&&!tp.rep))return;
  (S.tr[pid]=S.tr[pid]||[]);
  if(tp.drinkStaff){
    if(S.money<1800)return;S.money-=1800;S.drinks=(S.drinks||0)+1;advance(60*mult());S.alc=clamp(S.alc+15);S.crave=clamp(S.crave-20);
    S.loy[pid]=clamp(S.loy[pid]+12);S.f['ital_'+pid+'_'+dayIdx()]=1;
    S.tr[pid].push({q:tp.l,a:DYN.staffDrink(pid)});render();return;
  }
  const lucidOk=!tp.lucid||inWin(hourOf(S.t),tp.lucid);
  if(tp.drink){if(S.money<900)return;S.money-=900;S.drinks=(S.drinks||0)+1;advance(45*mult());S.alc=clamp(S.alc+20);S.crave=clamp(S.crave-35)}
  else if(tp.cost){if(S.money<tp.cost)return;S.money-=tp.cost;act(tp.mins||60)}
  else act(tp.mins||15);
  if(!lucidOk){S.tr[pid].push({q:tp.l,a:DYN.apaConfused()});render();return}
  if(tp.sober&&S.alc>55){
    S.tr[pid].push({q:tp.l,a:'<i>A kérdéseid összefolynak. Később már nem emlékszel, mit válaszolt. Józanon kellene visszajönni.</i>'});render();return;
  }
  const dy=tp.dyn&&((CASE.dyn&&CASE.dyn[tp.dyn])||DYN[tp.dyn]);
  const txt=dy?dy(S,API):tp.t;
  S.tr[pid].push({q:tp.l,a:txt});
  if(!tp.rep)S.done[key]=1;
  if(tp.excl)S.done[pid+':'+tp.excl]=1;
  if(tp.ev)[].concat(tp.ev).forEach(addEv);if(tp.doc)addDoc(tp.doc);if(tp.f)[].concat(tp.f).forEach(setF);
  if(tp.eff)for(const k in tp.eff)S[k]=clamp(S[k]+tp.eff[k]);
  if(tp.loy)for(const k in tp.loy)S.loy[k]=clamp(S.loy[k]+tp.loy[k]);
  if(tp.pat)S.pat+=tp.pat;
  if(tp.f==='leak')S.f.leak=S.t;
  checkPat();render();
}

// ---------- tábla ----------
function revealed(s){return CASE.suspects[s].reveal.some(has)}
const vKnown=v=>!v.known||has(v.known);
const supOf=id=>(E[id].sup||[]);
const supMatch=(id,s,r,v)=>supOf(id).some(x=>x[0]===s&&x[1]===r&&(!x[2]||x[2]==='*'||x[2]===v));
function clearsOf(id,s,v){const c=E[id].clears;if(!c)return false;const L2=typeof c==='string'?[[c,'*']]:(Array.isArray(c[0])?c:[c]);return L2.some(x=>x[0]===s&&(x[1]==='*'||x[1]===v))}
function selCard(id){if(!S.ev[id])return;
  const i=S.sel.indexOf(id);
  if(i>=0)S.sel.splice(i,1);else{S.sel.push(id);if(S.sel.length>2)S.sel.shift()}
  render();
}
function pin(s,r){if(S.sel.length!==1)return;S.board[S.sel[0]]={s,r};S.sel=[];render()}
function unpin(){S.sel.forEach(id=>delete S.board[id]);S.sel=[];render()}
function deduce(){
  if(S.sel.length!==2)return;
  const [a,b]=S.sel;act(15);
  const d=CASE.ded.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
  S.sel=[];
  if(!d){
    const open=CASE.ded.filter(x=>!S.ev[x.g]&&S.ev[x.a]&&S.ev[x.b]);
    const near=[a,b].find(id=>open.some(x=>x.a===id||x.b===id));
    note(near?`Ez a két nyom közvetlenül nem függ össze. Ennek viszont van párja a táblán, csak nem ez: <b>${E[near].n}</b>.`:'Ez a két nyom közvetlenül nem függ össze. Próbálj más párt.','bad');render();return}
  if(S.ev[d.g]){note('Ezt már összeraktad.');render();return}
  addEv(d.g);if(d.f)setF(d.f);
  modal(`<h2>${E[d.g].n}</h2><p>${d.t}</p>`,[['Felírod a táblára','close']]);
}
const openVict=()=>VICT.filter(v=>vKnown(v)&&!S.verd[v.id]);
function accuse(s){
  const pins=Object.entries(S.board).filter(([,v])=>v.s===s);
  const list=pins.map(([id,v])=>`<li><b>${CAT[v.r]}:</b> ${E[id].n}</li>`).join('')||'<li>Semmi.</li>';
  const ov=openVict();
  if(!ov.length){modal('<h2>Nincs nyitott gyilkosság</h2><p>Minden ismert áldozat ügyében emeltél már vádat.</p>',[['Rendben','close']]);return}
  const multi=VICT.length>1;
  const vsel=multi?`<p><b>Melyik gyilkosságért?</b></p><div class="vchk">${ov.map(v=>`<label><input type="checkbox" value="${v.id}"> ${v.n}</label>`).join('')}</div>`:'';
  modal(`<h2>Vádemelés: ${CASE.suspects[s].name}</h2>${vsel}<p>Az ügyész elé ezt viszed:</p><ul>${list}</ul><p class="mut">Minden kiválasztott gyilkossághoz kell indíték, alkalom és módszer, a megfelelő rovatban. Ha a vád nem áll meg, a főnököd türelme fogy. Ha elfogy, elveszik tőled az ügyet.</p>`,[['Beviszed','acc:'+s],['Még nem','close']]);
}
function judge(s){
  const vids=VICT.length>1?[...document.querySelectorAll('.vchk input:checked')].map(i=>i.value):['main'];
  if(!vids.length){note('Jelöld be, melyik gyilkosságért emelsz vádat.','bad');return}
  closeModal();
  const pins=Object.entries(S.board).filter(([,v])=>v.s===s);
  act(90);
  for(const v of vids){
    const clear=Object.keys(S.ev).find(id=>clearsOf(id,s,v));
    if(clear){S.rejects++;S.pat-=20;
      queue(`<h2>Az ügyész visszadobja</h2><p>Felolvas egy sort a saját anyagodból: <i>${E[clear].n}: ${E[clear].d}</i></p><p>„Ön ezt maga derítette ki, főhadnagy. Mit akar ezzel?”</p>`);checkPat();render();return}
  }
  const missing=[];
  for(const v of vids){
    const cov={};pins.forEach(([id,p])=>{if(supMatch(id,s,p.r,v))cov[p.r]=1});
    const m=['I','A','M'].filter(k=>!cov[k]);
    if(m.length)missing.push((VICT.length>1?VICT.find(x=>x.id===v).n+': ':'')+m.map(k=>CAT[k].toLowerCase()).join(', '));
  }
  if(missing.length){
    S.rejects++;S.pat-=20;
    const extra=CASE.rejectExtra&&CASE.rejectExtra[s]?CASE.rejectExtra[s]:'';
    if(extra)S.pat-=10;
    queue(`<h2>Az ügyész visszadobja</h2><p>„Ezzel nem megyek bíróság elé. Nincs meg, vagy nem jó helyen van:</p><ul>${missing.map(x=>`<li>${x}</li>`).join('')}</ul>${extra}<p class="mut">A főnököd türelme fogy.</p>`,[['Vissza a táblához','close']]);
    checkPat();render();return;
  }
  vids.forEach(v=>{S.verd[v]={s,ok:SOL[v]===s,t:S.t}});
  if(CASE.onVerdict)CASE.onVerdict(S,s,vids,API);
  if(VICT.length===1)return finish(S.verd.main.ok?'win':'wrong',s);
  queue(`<h2>Vádemelés</h2><p>Az ügyészség vádat emel ${CASE.suspects[s].name} ellen: ${vids.map(v=>VICT.find(x=>x.id===v).n).join(', ')} meggyilkolása miatt.</p><p class="mut">Hogy igazad volt-e, az csak a végén derül ki.</p>`);
  if(CASE.over?CASE.over(S,API):VICT.every(v=>S.verd[v.id]))finish('multi');else render();
}
function checkPat(){if(S.pat<=0&&!S.ended)finish('fired')}
function grade(){
  const days=(S.t-CASE.start.t)/1440,par=CASE.par||3;
  let sc=100;const lines=[];
  const wrong=Object.values(S.verd).filter(v=>!v.ok).length;
  if(S.ended==='fired'){sc=10;lines.push('Elvették tőled az ügyet')}
  if(wrong){sc-=25*wrong;lines.push(`${wrong} téves vád`)}
  if(S.rejects){sc-=8*S.rejects;lines.push(`${S.rejects} visszadobott vád`)}
  if(days>par){const d=Math.ceil(days-par);sc-=5*d;lines.push(`${d} nappal a vártnál lassabban`)}
  const extra=CASE.bonus?CASE.bonus(S,API):[];extra.forEach(([p,l])=>{sc+=p;lines.push(l)});
  sc=Math.max(0,Math.min(100,sc));
  const g=sc>=85?'A':sc>=70?'B':sc>=50?'C':'D';
  return{g,sc,lines};
}
function finish(k,s){
  S.ended=k;
  const h=Math.round((S.t-CASE.start.t)/60);
  let title,body;
  if(k==='fired'){title='Elveszik tőled az ügyet';body=CASE.end.fired||'<p>Reggel a főnököd az asztalodra teszi a jelvényedet, és nem néz rád. Az ügyet más viszi tovább. Te a Hordóban ülsz, és Laci kérdés nélkül tölt.</p>'}
  else if(k==='multi'){title=CASE.end.title?CASE.end.title(S,API):'Ügy lezárva';body=CASE.end.multi(S,API)}
  else{title=k==='win'?'Ügy lezárva':'Rossz ember';body=k==='win'?CASE.end.win(S,API):(CASE.end.wrong[s]||'')}
  const gr=grade();
  const m=meta();m.done[S.case]={res:k,g:gr.g,t:Date.now()};
  m.persist={money:S.money,loy:S.loy,f:Object.fromEntries(PERSIST.filter(x=>S.f[x]).map(x=>[x,1]))};
  saveMeta(m);save();
  const idx=CASE_IDS.indexOf(S.case),next=CASE_IDS[idx+1];
  modal(`<h2>${title}</h2>${body}<div class="grade"><b>${gr.g}</b><div><p>Értékelés: ${gr.sc}/100</p><p class="mut">${Math.floor(h/24)} nap ${h%24} óra · ${nEv()} bizonyíték${gr.lines.length?' · '+gr.lines.join(' · '):''}</p></div></div>`,
    (next?[[`Következő ügy: ${CASES[next].title}`,'startcase:'+next]]:[]).concat([['Ügyek','title'],['Bezár','close']]));
  render();
}

function openMarks(id){return[...CASE.docs[id].b.matchAll(/\[\[(\w+)\|/g)].filter(m=>!S.ev[m[1]]).length}
function leads(){
  const out=[];
  const mk=Object.keys(S.docs).reduce((a,id)=>a+openMarks(id),0);
  if(mk)out.push(`Az aktákban ${mk} fontos sor vár még kiemelésre. Nyisd meg az Akták fület, és kattints a kiemelt sorokra.`);
  const dd=new Set(CASE.ded.filter(d=>S.ev[d.a]&&S.ev[d.b]&&!S.ev[d.g]).map(d=>d.g)).size;
  if(dd){const fd=CASE.ded.find(d=>S.ev[d.a]&&S.ev[d.b]&&!S.ev[d.g]);out.push(`A táblán ${dd} olyan nyompár van, amely összefügg. Kezdd például ezzel, és keresd meg a párját: <b>${E[fd.a].n}</b>.`)}
  (CASE.leads||[]).forEach(l=>{if(reqOk(l.need)&&!(l.not||[]).some(k=>k.split('|').some(has)))out.push(l.x)});
  const tk=CASE.tasks.filter(taskAvail).length;
  if(tk)out.push(`A Stáb fülön ${tk} kiadható feladat vár.`);
  return out;
}
function renderLog(){const ld=leads(),U=S.ui||{};
  const evs=Object.keys(S.ev).sort((a,b)=>S.ev[a]-S.ev[b]);
  const tm=t=>`<time>${dayLabel(t).split(' · ')[0]} ${clock(t)}</time>`;
  return`<div class="pane wide"><h1>Napló</h1>
  <details data-ui="leads" ${U.leads===false?'':'open'}><summary>Nyitott szálak <span>${ld.length}</span></summary>${ld.length?`<ul class="leads">${ld.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="mut">Nincs nyitott szál. Ha megvan a tettes, a táblán emelhetsz vádat.</p>'}</details>
  <details data-ui="evid" ${U.evid?'open':''}><summary>Bizonyítékok <span>${evs.length}</span></summary><dl class="evl">${evs.map(id=>`<dt>${E[id].n}${tm(S.ev[id])}</dt><dd>${E[id].d}</dd>`).join('')}</dl></details>
  <details data-ui="notes" ${U.notes?'open':''}><summary>Helyszíni jegyzetek <span>${S.notes.length}</span></summary><dl class="evl">${S.notes.map(x=>`<dt>${x.loc}: ${x.l}${tm(x.t)}</dt><dd>${x.x}</dd>`).join('')}</dl></details>
  <details data-ui="events" ${U.events?'open':''}><summary>Események <span>${S.log.length}</span></summary><ul class="log">${S.log.map(x=>`<li>${tm(x.t)}${x.x}</li>`).join('')}</ul></details></div>`}
function renderSave(){
  return`<div class="pane wide"><h1>Mentés</h1><p>A játék minden lépés után ebbe a böngészőbe ment. Ha másik gépen folytatnád, másold ki a mentéskódot.</p>
  <div class="list"><button data-a="copysave">Mentéskód másolása</button></div>
  <textarea id="imp" rows="4" placeholder="Ide illeszd be a mentéskódot"></textarea>
  <div class="list"><button data-a="import">Betöltés kódból</button><button data-a="title">Ügyek, új játék</button></div></div>`;
}
function render(){
  if(!S)return;
  const t=S.tab;
  $('#game').classList.toggle('full',!!t&&t!=='map');
  renderHUD();renderMap();
  $('#panel').innerHTML=t==='board'?renderBoard():t==='docs'?renderDocs():t==='staff'?renderStaff():t==='log'?renderLog():t==='save'?renderSave():S.view.startsWith('talk:')?renderTalk(S.view.slice(5)):renderLoc();
  save();
}

// ---------- kezdőképernyő ----------
function titleScreen(){
  const m=meta(),cur=load();
  const rows=CASE_IDS.map((id,i)=>{const c=CASES[id],d=m.done[id];
    const st=d?`Lezárva · ${d.g}`:(cur&&cur.case===id&&!cur.ended?'Folyamatban':'');
    return`<li><div><b>${i+1}. ${c.title}</b><span>${c.tagline||''}</span>${st?`<em>${st}</em>`:''}</div><button data-a="startcase:${id}">${cur&&cur.case===id&&!cur.ended?'Újrakezdés':'Indítás'}</button></li>`}).join('');
  const cont=cur&&!cur.ended&&CASES[cur.case]?[[`Folytatás: ${CASES[cur.case].title}`,'continue']]:[];
  modal(`<div class="title"><h2>Redemption</h2><p class="deck">Mátrai Dénes ügyei</p><ul class="cases">${rows}</ul><p class="mut">Az ügyek egymásra épülnek: a személyes döntéseid (lányod, apád, Nóra, a stáb) átkerülnek a következő ügybe.</p></div>`,cont.concat(S&&!S.ended?[['Vissza','close']]:[]));
}
function startCase(id){
  Q=[];S=fresh(id);S.visited[S.loc]=1;
  modal(`<h2>${CASES[id].num||''} ${CASE.title}</h2>${typeof CASE.intro==='function'?CASE.intro(S,API):'<p>'+CASE.intro+'</p>'}`,[['Elindulsz','start']]);
  render();
}

// ---------- események ----------
function handle(a){
  const [k,x,y]=a.split(':');
  switch(k){
    case'go':if(S.tab&&S.tab!=='map')S.tab=null;go(x);break;
    case'travel':closeModal();go(x,y);break;
    case'tab':S.tab=x==='map'?null:(S.tab===x?null:x);if(x==='docs'&&S.doc&&S.docs[S.doc])S.docs[S.doc].n=0;S.sel=[];render();$('#panel').scrollTop=0;break;
    case'talk':talk(x);break;
    case'back':S.view='loc';render();break;
    case'tp':topic(x,y);break;
    case'hs':inspect(x);break;
    case'do':doAction(x);break;
    case'card':selCard(x);break;
    case'pin':pin(x,y);break;
    case'unpin':unpin();break;
    case'clearsel':S.sel=[];render();break;
    case'deduce':deduce();break;
    case'acc?':accuse(x);break;
    case'acc':judge(x);break;
    case'doc':{if(!S.docs[x])break;const first=S.docs[x].n;S.doc=x;S.docs[x].n=0;if(first)act(10);render();$('.paper')?.scrollIntoView({block:'nearest'});break}
    case'mark':addEv(x);render();break;
    case'disp':dispatch(x,y);break;
    case'close':closeModal();break;
    case'title':titleScreen();break;
    case'startcase':startCase(x);break;
    case'new':startCase(S?S.case:CASE_IDS[0]);break;
    case'start':closeModal();if(CASE.onStart){CASE.onStart(S,API)}checkTimed();render();break;
    case'continue':{const v=load();if(v&&CASES[v.case||'c1']){S=v;S.case=S.case||'c1';setCase(S.case);upgrade();S.tab=null}closeModal();break}
    case'copysave':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(code).then(()=>note('Mentéskód a vágólapon.'),()=>{$('#imp').value=code;note('Másold ki a mezőből.')})}catch(e){$('#imp').value=code}break}
    case'import':{try{const v=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(v&&v.t){S=v;S.case=S.case||'c1';setCase(S.case);upgrade();S.tab=null;render();note('Mentés betöltve.')}}catch(e){note('Ez nem érvényes mentéskód.','bad')}break}
  }
}
function upgrade(){S.loy=S.loy||{};STAFF.forEach(id=>{if(S.loy[id]==null)S.loy[id]=60});S.notes=S.notes||[];S.verd=S.verd||{};S.view=S.view||'loc';S.prev=S.prev||meta().done}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();handle(b.dataset.a)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.ui&&S){(S.ui=S.ui||{})[d.dataset.ui]=d.open;save()}},true);
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-a]')){e.preventDefault();handle(e.target.dataset.a)}
  if(e.key==='Escape'&&!$('#modal').hidden&&$('#modal .mbtns [data-a="close"]'))closeModal();
});

const saved=load();
if(saved&&saved.t&&CASES[saved.case||'c1']){S=saved;S.case=S.case||'c1';setCase(S.case);upgrade();S.tab=null;render()}
else{setCase(CASE_IDS[0]);S=fresh(CASE_IDS[0]);render()}
titleScreen();
const mapRO=new ResizeObserver(()=>{if(S)renderMap()});mapRO.observe($('.mapwrap'));
window.__noir={get S(){return S},handle,advance,setCase};
}

</script>
</body>
</html>
