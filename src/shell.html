<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Révész – noir nyomozás</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: kemény, szűkszavú skandináv noir, pesti novemberi esőben
   IDEA: a nyomozó asztala – esti várostérkép, parafatábla piros cérnával, gépelt akták
   PICTURE: a város térképe tölti ki az első képernyőt; minden helyszín egy gombostű
   COLOUR and TYPE: nedves aszfalt-pala, akta-papír, egyetlen vérpiros; Barlow Condensed + Source Serif 4 + IBM Plex Mono az aktákhoz
   LAYOUT: fent műszerfal, balra térkép, jobbra a jelenet; mobilon egymás alatt */
:root{color-scheme:dark;--bg:#13181a;--panel:#1b2124;--panel2:#222a2e;--line:#323d42;--ink:#e7e3da;--mut:#8e999b;--red:#c9372c;--red2:#7d231d;--paper:#ebe4d4;--pink:#1e1c18;--water:#0c1316;--buda:#1c2427;--pest:#182023}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Serif 4",Georgia,serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,g[data-a]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3,h4,#hud,nav,.card b,.person b,.dest,.task,.sc b,.mug{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
#hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 22px;align-items:center;padding:10px max(2vw,12px);background:#0e1214;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.when b{font-size:32px;line-height:1;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.when span{color:var(--mut);font-size:15px}
.meters{display:flex;gap:14px;flex-wrap:wrap}
.meter{flex:1 1 110px;max-width:200px;font-size:14px;color:var(--mut)}
.meter i{display:block;height:6px;background:#283236;margin-top:3px;position:relative}
.meter i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:#a9b2b2;transition:width .4s}
.meter.hot{color:#f0b3ab}.meter.hot i::after{background:var(--red)}
.cash{text-align:right}.cash b{font-size:22px;display:block;white-space:nowrap}.cash span{font-size:14px;color:#f0b3ab}
nav{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--line);padding:6px 14px;min-height:40px;font-size:17px;letter-spacing:.02em}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav em{font-style:normal;background:var(--red);color:#fff;padding:0 6px;border-radius:9px;font-size:13px}
#game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);min-height:calc(100vh - 110px)}
.mapwrap{position:relative;background:var(--pest);border-right:1px solid var(--line);overflow:hidden}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap::after{content:"";position:absolute;inset:-40px;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(200,215,220,.05) 9px 10px);animation:rain 1.1s linear infinite}
@keyframes rain{to{transform:translate(-14px,40px)}}
@media(prefers-reduced-motion:reduce){.mapwrap::after{animation:none}}
.pest{fill:var(--pest)}.buda{fill:var(--buda)}.ctr{fill:none;stroke:#26302f;stroke-width:1.2}
.road{fill:none;stroke:#2b3539;stroke-width:5;stroke-linecap:round}
.river{fill:none;stroke:var(--water);stroke-width:50;stroke-linecap:round;stroke-linejoin:round}
.glint{fill:none;stroke:#1f2d33;stroke-width:2;stroke-dasharray:18 22}
.island{fill:#1e2a24}.bridge{stroke:#55605f;stroke-width:6}
.area{font:italic 44px "Source Serif 4",serif;fill:#2c3739}
.pin{cursor:pointer}.pin .hit{fill:transparent}
.pin .dot{fill:var(--paper);stroke:#0b0f10;stroke-width:3}
.pin .ring{fill:none;stroke:var(--red);stroke-width:3}
.pin.cur .dot{fill:var(--red)}
.pin.closed .dot{fill:#5b6466}
.pin .lbl{font:600 19px "Barlow Condensed",sans-serif;fill:var(--ink);paint-order:stroke;stroke:#0b0f10;stroke-width:5px}
.pin .sub{font:15px "Barlow Condensed",sans-serif;fill:#9aa5a6;paint-order:stroke;stroke:#0b0f10;stroke-width:4px}
.pin:hover .dot{fill:var(--red)}
#panel{overflow:auto;max-height:calc(100vh - 110px);background:var(--panel)}
#game.full{grid-template-columns:minmax(0,1fr)}#game.full .mapwrap{display:none}#game.full #panel{max-height:none}
.pane{padding:22px clamp(16px,2.4vw,30px) 40px;max-width:760px}
.pane.wide{max-width:1240px;margin:0 auto}
h1{font-size:36px;line-height:1.05;margin:0 0 6px;font-weight:700;text-wrap:balance}
h2{font-size:28px;line-height:1.1;margin:0 0 12px}
h3{font-size:18px;color:var(--mut);margin:22px 0 8px;font-weight:600}
.mut{color:var(--mut);margin:0 0 8px;font-size:15px}
.desc,.bio{margin:10px 0}
blockquote.seen{margin:14px 0;padding:12px 16px;border-left:3px solid var(--red);background:var(--panel2);font-style:italic}
.list{display:flex;flex-direction:column;gap:6px}
.list>button,.dest button{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;min-height:44px}
.list>button:hover:not(:disabled),.dest button:hover{border-color:var(--mut)}
.person b{display:block;font-size:20px;font-weight:600}.person span{color:var(--mut);font-size:15px}
.hs.done{opacity:.55}
.topic.conf{border-left:3px solid var(--red)}
.act{font-style:italic}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.dest button{display:flex;justify-content:space-between;gap:8px;font-size:17px}.dest span{color:var(--mut);white-space:nowrap}
.back{background:none;border:0;color:var(--mut);padding:6px 0;margin-bottom:8px;min-height:40px}
.tr .q{margin-top:14px;font-family:"Barlow Condensed",sans-serif;color:var(--mut);font-size:16px}
.tr .q::before{content:"– "}
.tr .a{margin:4px 0 0;padding-left:14px;border-left:2px solid var(--line)}
/* tábla */
.board{background:#1a1612 radial-gradient(circle at 30% 20%,#2a221b,#16120f 70%);min-height:100%}
.board{padding-bottom:200px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0e0c0af5;border-top:2px solid var(--red);padding:12px max(5vw,16px) 14px;max-height:55vh;overflow:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:#e3d9c8;font-size:15px;box-shadow:0 -8px 20px #0008}
.bar b{color:#fff}.pins{display:flex;flex-wrap:wrap;gap:8px 14px}.pg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.pg em{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-size:18px;margin-right:4px;color:#d8a39b}
.bar .pg button{background:#2b231c;border:1px solid #6a5643;color:#fff;padding:8px 12px;min-height:44px;font-family:"Barlow Condensed",sans-serif;font-size:17px}.bar .pg button:hover{border-color:var(--red);background:#3a2b20}
.pb{display:flex;gap:6px}.bar .ghost{background:none;border:1px solid #6a5643}.mut2{color:#9a8f7e;font-size:14px;flex-basis:100%}
.bar button,.accuse,.mbtns button,.task button{background:var(--red);border:0;color:#fff;padding:10px 16px;min-height:44px;font-family:"Barlow Condensed",sans-serif;font-size:18px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
.col{background:#2a231c;border:1px solid #3b3127;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.col::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 2px 3px #000}
.col.locked{opacity:.6;align-items:center;text-align:center;justify-content:center;min-height:200px}
.mug{width:56px;height:56px;border-radius:50%;background:#0e0c0a;border:2px solid #4a3e31;display:grid;place-items:center;font-size:28px;color:#c9bfae;align-self:center}
.col h4{margin:0;text-align:center;font-size:22px}
.row{border-top:1px dashed #5a4a3a;padding:8px 0 4px;min-height:54px;display:flex;flex-direction:column;gap:6px}
.row em{font-style:normal;font-family:"Barlow Condensed",sans-serif;color:#d8a39b;font-size:16px}
.row i{color:#8c7f6e;font-size:14px}
.row.drop{cursor:pointer;background:#c9372c1a;outline:1px dashed var(--red)}
.accuse{margin-top:auto}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:left;background:var(--paper);color:var(--pink);border:0;padding:10px 12px;box-shadow:0 3px 6px #0008;display:flex;flex-direction:column;gap:3px;transform:rotate(-.6deg)}
.card:nth-child(even){transform:rotate(.7deg)}
.card b{font-size:18px;line-height:1.1}.card span{font-size:14px;line-height:1.35;color:#4a463e}
.card.ded{background:#f1dcc6;border-left:4px solid var(--red)}
.card.clr{background:#d9e3d6}
.card.sel{outline:3px solid var(--red);transform:none}
.card.pinned span{display:none}
.card.unseen{background:#f6f1e3;outline:2px dashed var(--red);outline-offset:-4px}.card .nw{color:var(--red2);font-style:italic}.card.pinned.unseen .nw{display:block}
.hintmark{font:600 13px "Barlow Condensed",sans-serif;background:var(--red);color:#fff;padding:1px 6px;margin-right:4px}
.ends{margin-top:6px}.ends summary{font:14px "Source Serif 4",serif;color:#5a554a;min-height:0;padding:2px 0}.ends ul{margin:4px 0;padding-left:18px;font-size:14px;color:#3d3a33}
.toast.loc{border-left-color:#8fb3d1}
/* akták */
.dl{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:18px;margin-top:10px}
.dlist{display:flex;flex-direction:column;gap:6px}
.dlist button{text-align:left;background:var(--panel2);border:1px solid var(--line);padding:10px 12px;min-height:44px}
.dlist button.on{border-color:var(--paper)}
.dlist small{display:block;color:#f0b3ab;font-size:13px}
.leads{margin:0;padding-left:20px}
details{border-top:1px solid var(--line);padding:4px 0}details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font:600 22px "Barlow Condensed",sans-serif;padding:10px 0;min-height:44px;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}summary::before{content:"▸";color:var(--red);transition:transform .2s}details[open]>summary::before{transform:rotate(90deg)}
summary span{font-size:15px;color:var(--mut);font-weight:500}
.evl{margin:0 0 12px}.evl dt{font:600 18px "Barlow Condensed",sans-serif;margin-top:10px;display:flex;justify-content:space-between;gap:10px}.evl dt time{font:13px "IBM Plex Mono",monospace;color:var(--mut);white-space:nowrap}.evl dd{margin:2px 0 0;color:#cfcac0;font-size:15px}
.bar>span{flex-basis:100%}.bd{flex-basis:100%;max-width:900px}.bd b{font:600 20px "Barlow Condensed",sans-serif}.bd small{color:#d8a39b}.bd p{margin:2px 0 4px;color:#d9d0bf;font-size:15px}
.bd.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.leads li{margin:0 0 8px}
.dlist em{font-style:normal;color:#fff;background:var(--red);padding:0 5px;font-size:13px}
.paper{background:var(--paper);color:var(--pink);padding:24px clamp(16px,3vw,36px);box-shadow:0 6px 18px #0009;min-height:300px}
.paper h2{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500}
.hint{font-size:14px;color:#6c665a;font-style:italic;margin:0 0 14px}
.mono{font:15px/1.7 "IBM Plex Mono",monospace}
.mark{font:inherit;background:#e8cf8a66;border:0;padding:1px 2px;text-align:left;color:inherit;border-bottom:2px solid #b08a2e;cursor:pointer;display:inline}
.mark:not(.found)::after{content:' + tábla';font:600 12px 'Barlow Condensed',sans-serif;background:var(--red);color:#fff;padding:1px 5px;margin-left:4px;white-space:nowrap}
.mark:hover{background:#e8cf8aaa}
.mark.found{background:#c9372c2e;border-bottom:2px solid var(--red)}
/* stáb */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sc{background:var(--panel2);border:1px solid var(--line);padding:12px 14px}
.sc b{font-size:20px;display:block}.sc span{color:var(--mut);font-size:15px}.sc p{font-size:15px;margin:6px 0}
.sc em{font-style:normal;font-size:14px;color:#a9d1b5}.sc.busy em{color:#f0c089}.sc.off em{color:var(--mut)}
.task{background:var(--panel2);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.task>b{font-size:20px}.task>span{color:var(--mut);margin-left:10px}
.task div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.task button{font-size:16px;padding:8px 12px}
.pend{margin:0;padding-left:18px}
.log{list-style:none;padding:0;margin:0}.log li{padding:8px 0;border-bottom:1px solid var(--line)}
.log time{display:block;font:14px "IBM Plex Mono",monospace;color:var(--mut)}
textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);font:14px "IBM Plex Mono",monospace;padding:10px;margin:12px 0}
.danger{border-color:var(--red2)!important}
/* címlap, kezdőképernyő, áldozatok */
.paperfront{font-family:"Source Serif 4",serif}
.paperfront .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #1e1c18;padding-bottom:6px;margin-bottom:14px;font:italic 700 40px "Source Serif 4",serif}
.paperfront .mast span{font:14px "IBM Plex Mono",monospace;font-style:normal}
.paperfront h2{font:700 38px/1.05 "Source Serif 4",serif;margin:0 0 10px;text-wrap:balance}
.paperfront .deck,.title .deck{font-style:italic;font-size:19px;color:#3d3a33;margin:0 0 12px}
.title h2{font-size:52px;margin:0}
.cases{list-style:none;padding:0;margin:18px 0}.cases li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #c9bfa9}
.cases b{display:block;font:600 24px "Barlow Condensed",sans-serif}.cases span{display:block;font-size:15px;color:#5a554a}.cases em{font-style:normal;font-size:14px;color:var(--red2)}
.cases button{background:var(--red);border:0;color:#fff;padding:10px 16px;min-height:44px;font:18px "Barlow Condensed",sans-serif;flex:none}
.victims{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:6px 0 18px}
.vic{background:#0e0c0a;border:1px solid #4a3e31;border-left:4px solid var(--red);padding:8px 12px}.vic.done{border-left-color:#8a7e6a}
.vic b{display:block;font:600 19px "Barlow Condensed",sans-serif}.vic span{display:block;font-size:13px;color:#9a8f7e}.vic em{font-style:normal;font-size:14px;color:#d8a39b}
.cols.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols.n5{grid-template-columns:repeat(5,minmax(0,1fr))}.cols.n5 .col h4{font-size:19px}
@media(max-width:1200px){.cols.n5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card .vt{font:600 12px "Barlow Condensed",sans-serif;background:#1e1c18;color:#e8dcc4;padding:1px 6px;align-self:flex-start;margin-bottom:2px}
.vchk{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}.vchk label{display:flex;gap:10px;align-items:center;font-size:17px;min-height:40px}.vchk input{width:22px;height:22px;accent-color:var(--red)}
.grade{display:flex;gap:16px;align-items:center;border-top:1px solid #c9bfa9;margin-top:16px;padding-top:14px}.grade>b{font:700 56px "Barlow Condensed",sans-serif;color:var(--red2);line-height:1}.grade p{margin:0}
.loy{display:inline-block;width:80px;height:6px;background:#283236;vertical-align:middle;position:relative}.loy i{position:absolute;inset:0 auto 0 0;width:var(--v);background:#a9d1b5}
.sc .ly{font-size:14px;color:var(--mut)}
nav .casebtn{margin-left:auto;border-color:transparent;color:var(--mut);font-size:16px}
/* modál, értesítés */
#modal{position:fixed;inset:0;background:#05080ad9;display:grid;place-items:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--paper);color:var(--pink);max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:28px clamp(18px,4vw,38px);box-shadow:0 20px 50px #000}
.mbox h2{font-size:32px}.mbox p{margin:0 0 12px}.mbox .mut{color:#6c665a}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.mbtns button:not(:first-child){background:#2b2724}
#toasts{position:fixed;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:30;max-width:min(380px,calc(100vw - 28px))}
.toast{background:#0e1214;border:1px solid var(--line);border-left:4px solid var(--mut);padding:10px 14px;font-size:15px;box-shadow:0 6px 16px #000a;transition:opacity .5s}
.toast.ev{border-left-color:var(--red)}.toast.msg{border-left-color:#a9d1b5}.toast.doc{border-left-color:var(--paper)}.toast.bad{border-left-color:#f0c089}
.toast.out{opacity:0}
body:has(.bar) #toasts{bottom:auto;top:130px}
@media(max-width:900px){
 #game{grid-template-columns:minmax(0,1fr)}
 .mapwrap{height:52vh;min-height:320px;border-right:0;border-bottom:1px solid var(--line)}
 #panel{max-height:none}
 .cols,.cols.n4,.cols.n5{grid-template-columns:minmax(0,1fr)}
 .dl{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
 nav .casebtn{display:none}.title h2{font-size:40px}.paperfront h2{font-size:30px}.cases li{flex-wrap:wrap}
 .bar{padding:10px 12px;gap:6px 10px}.bd.two{grid-template-columns:1fr}.bd p{font-size:14px}.pins{gap:6px;width:100%}.pg{flex-wrap:nowrap;width:100%}.pg em{width:62px;flex:none;font-size:16px}.bar .pg button{flex:1;padding:6px 4px;font-size:15px;min-height:40px}.mut2{display:none}
 #hud{grid-template-columns:auto minmax(0,1fr);gap:6px 12px}
 .meters{grid-column:1/-1;order:3}.cash{text-align:right}
 .when b{font-size:26px}
 nav button{flex:1 1 30%;padding:6px 8px;font-size:16px}
 .pin .lbl{font-size:34px;stroke-width:7px}
 h1{font-size:30px}
}
.sil{width:40px;height:46px;flex:none;border-radius:4px;border:1px solid #3a332b;display:block}
.sil.big{width:72px;height:84px}.sil.mugsil{width:100%;height:100%;border:0;border-radius:50%}
button.person{display:flex;gap:12px;align-items:center;text-align:left}
.thead{display:flex;gap:16px;align-items:center}.thead h1{margin:0}
.sch{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.mug{overflow:hidden;padding:0}
</style>
</head>
<body>
<header id="hud"></header>
<main id="game"><section class="mapwrap"><svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="A város térképe"></svg></section><aside id="panel"></aside></main>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mbody"></div><div class="mbtns"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
/*CASES*/
/*ENGINE*/
</script>
</body>
</html>
